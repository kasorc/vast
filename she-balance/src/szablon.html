<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>She Balance – animacja</title>
<style>
  /*FONTS*/
  :root{--page:#F4F2EF;--ink:#333333;--muted:#6B6B6B}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page:#1c211d;--ink:#e7ebe4;--muted:#9aa59b}}
  :root[data-theme="dark"]{--page:#1c211d;--ink:#e7ebe4;--muted:#9aa59b}
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--ink);font-family:"Mulish",system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px;gap:14px}
  .stage-wrap{width:min(100%, calc((100vh - 110px) * 9 / 16));aspect-ratio:9/16;border-radius:22px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.18)}
  svg#stage{width:100%;height:100%;display:block}
  .controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
  .controls button{font:inherit;background:none;border:1px solid var(--muted);color:var(--ink);padding:6px 14px;cursor:pointer;letter-spacing:.12em;font-size:12px;text-transform:uppercase}
  .dots{display:flex;gap:6px}
  .dots button{width:10px;height:10px;padding:0;border-radius:50%;border:1px solid var(--muted);background:none}
  .dots button.on{background:var(--ink);border-color:var(--ink)}
  .bar{width:min(100%,360px);height:3px;background:rgba(127,127,127,.25);overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--ink)}
  body.rec{padding:0;gap:0} body.rec .stage-wrap{width:100vw;height:100vh;border-radius:0;box-shadow:none}
  body.rec .controls, body.rec .bar{display:none}

  /* typografia */
  .caps{font-family:"Mulish",sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.22em}
  .thin{font-family:"Forum",Georgia,serif;letter-spacing:.14em}
  .serif{font-family:"Forum",Georgia,serif}

  /* tło: przejście kołem */
  #wipe{transform-origin:270px 480px;transform:scale(0)}
  #wipe.go{animation:wipe .6s cubic-bezier(.7,0,.25,1) both}
  @keyframes wipe{from{transform:scale(0)}to{transform:scale(1)}}
  #cam{transform-origin:270px 520px}
  #cam.go{animation:zoom 3s linear both}
  @keyframes zoom{from{transform:scale(1)}to{transform:scale(1.045)}}

  /* sceny */
  .scene{opacity:0;transition:opacity .3s ease;pointer-events:none}
  .scene.active{opacity:1}
  .scene.active .rise{animation:rise .6s cubic-bezier(.2,.9,.2,1) both}
  .scene.active .d1{animation-delay:.12s}.scene.active .d2{animation-delay:.28s}.scene.active .d3{animation-delay:.45s}.scene.active .d4{animation-delay:.65s}.scene.active .d5{animation-delay:.85s}
  @keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
  .scene.active .ch{transform-box:fill-box;transform-origin:50% 70%;animation:chIn .55s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--d0,0s) + var(--i) * 38ms)}
  @keyframes chIn{from{opacity:0;transform:translateY(26px) scale(.3) rotate(-14deg)}to{opacity:1;transform:none}}
  .scene.active .pop{transform-box:fill-box;transform-origin:center;animation:pop .55s cubic-bezier(.3,1.7,.5,1) both}
  @keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
  .scene.active .draw{stroke-dasharray:1;animation:draw 1s ease both}
  @keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
  .scene.active .fly{animation:fly .7s cubic-bezier(.2,1.2,.3,1) both}
  @keyframes fly{from{transform:translate(var(--fx),var(--fy)) rotate(var(--fr,0deg)) scale(.4);opacity:0}to{transform:none;opacity:1}}
  .scene.active .burst{transform-box:fill-box;transform-origin:center;animation:burst 1.1s ease-out both}
  @keyframes burst{from{transform:scale(.2);opacity:1;stroke-width:6}to{transform:scale(3.2);opacity:0;stroke-width:1}}
  .scene.active .conf{animation:conf 1.8s cubic-bezier(.1,.7,.3,1) both}
  @keyframes conf{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--dr));opacity:0}}
  .scene.active .logoPop{transform-box:fill-box;transform-origin:center;animation:logoPop .8s cubic-bezier(.3,1.5,.5,1) both}
  @keyframes logoPop{from{transform:scale(.2) rotate(-25deg);opacity:0}to{transform:none;opacity:1}}
  .scene.active .sunRise{animation:sunRise 1.4s cubic-bezier(.2,.8,.2,1) both}
  @keyframes sunRise{from{transform:translateY(280px)}to{transform:none}}
  .scene.active .grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow .9s cubic-bezier(.3,1.3,.5,1) both}
  @keyframes grow{from{transform:scaleY(0)}to{transform:none}}
  .scene.active .mtn{animation:mtn 1s cubic-bezier(.2,.9,.2,1) both}
  @keyframes mtn{from{transform:translateY(160px)}to{transform:none}}

  /* ambient */
  .float{animation:float 2.4s ease-in-out infinite alternate}
  @keyframes float{from{transform:translateY(-6px) rotate(-4deg)}to{transform:translateY(7px) rotate(4deg)}}
  .spin{animation:spin 16s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .twinkle{transform-box:fill-box;transform-origin:center;animation:twinkle 1.4s ease-in-out infinite}
  @keyframes twinkle{0%,100%{opacity:.25;transform:scale(.55)}50%{opacity:1;transform:scale(1)}}
  .steam{animation:steam 1.8s ease-in-out infinite;opacity:0}
  @keyframes steam{0%{opacity:0;transform:translateY(6px)}40%{opacity:.85}100%{opacity:0;transform:translateY(-24px)}}
  .heart{animation:heart 2.2s ease-out infinite;opacity:0}
  @keyframes heart{0%{opacity:0;transform:translateY(0) scale(.4)}20%{opacity:1;transform:translateY(-20px) scale(1)}100%{opacity:0;transform:translateY(-170px) scale(.8)}}
  .leafFall{animation:fall linear infinite}
  @keyframes fall{from{transform:translate(0,-60px) rotate(0)}50%{transform:translate(40px,480px) rotate(200deg)}to{transform:translate(-20px,1020px) rotate(400deg)}}
  .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}15%{transform:scale(1.14)}30%{transform:scale(1)}45%{transform:scale(1.08)}}
  .flame{transform-box:fill-box;transform-origin:50% 100%;animation:flame .35s ease-in-out infinite alternate}
  @keyframes flame{from{transform:scaleY(.86) skewX(-4deg)}to{transform:scaleY(1.1) skewX(4deg)}}
  .dust{animation:dust linear infinite}
  @keyframes dust{0%{transform:translateY(0);opacity:0}15%{opacity:.7}85%{opacity:.7}100%{transform:translateY(-260px);opacity:0}}

  /* postacie */
  .pos{transition:transform .75s cubic-bezier(.6,0,.2,1)}
  .lean{transition:transform .6s ease;transform-origin:110px 300px}
  .hop{transform-origin:110px 300px}
  .hop.go{animation:hop .55s cubic-bezier(.3,0,.3,1) both}
  .charB .hop.go, .posB .hop.go{animation-delay:.08s}
  @keyframes hop{0%{transform:none}30%{transform:translateY(-26px) scale(.98,1.03)}60%{transform:translateY(0) scale(1.03,.97)}100%{transform:none}}
  .breathe{animation:breathe 3s ease-in-out infinite}
  @keyframes breathe{50%{transform:translateY(-2.5px)}}
  .tilt{transform-origin:110px 190px;animation:tilt 4.2s ease-in-out infinite}
  @keyframes tilt{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.8deg) translateY(-2px)}}
  .charB .tilt{animation-duration:4.8s;animation-delay:-1.6s}
  .sway{transform-origin:110px 60px;animation:sway 3.6s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.7deg)}}
  .eyes{transform-origin:110px 131px;animation:blink 3.4s infinite}
  .charA .eyes{transform-origin:110px 132px}
  .charB .eyes{animation-duration:3.9s;animation-delay:-1.3s}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.08)}}
  .pupils{animation:look 6s ease-in-out infinite}
  @keyframes look{0%,35%,100%{transform:none}45%,60%{transform:translateX(2.5px)}70%,85%{transform:translateX(-2px)}}
  .smile{transform-origin:110px 168px;animation:smile 4s ease-in-out infinite}
  @keyframes smile{0%,55%,100%{transform:scale(1)}65%,90%{transform:scale(1.12,1.25)}}
  .arm{opacity:0;transform:translateY(90px);transition:transform .45s cubic-bezier(.3,1.4,.5,1),opacity .2s}
  .wave{transform-origin:34px 300px;animation:waveA .45s ease-in-out infinite alternate}
  .charB .wave{transform-origin:186px 300px;animation-name:waveB}
  @keyframes waveA{from{transform:rotate(-7deg)}to{transform:rotate(9deg)}}
  @keyframes waveB{from{transform:rotate(7deg)}to{transform:rotate(-9deg)}}
  #stage[data-scene="meet"] .arm,#stage[data-scene="outro"] .arm{opacity:1;transform:none}

  .posA{transform:translate(10px,1010px) scale(1.18)} .posB{transform:translate(270px,1010px) scale(1.18)}
  #stage[data-scene="meet"] .posA{transform:translate(26px,600px) scale(1.18)}
  #stage[data-scene="meet"] .posB{transform:translate(254px,600px) scale(1.18)}
  #stage[data-scene="healthy"] .posA,#stage[data-scene="selfdev"] .posA,#stage[data-scene="autumn"] .posA,#stage[data-scene="camp"] .posA{transform:translate(10px,600px) scale(1.18)}
  #stage[data-scene="healthy"] .posB,#stage[data-scene="selfdev"] .posB,#stage[data-scene="autumn"] .posB,#stage[data-scene="camp"] .posB{transform:translate(270px,600px) scale(1.18)}
  #stage[data-scene="networking"] .posA{transform:translate(48px,600px) scale(1.18)}
  #stage[data-scene="networking"] .posB{transform:translate(232px,600px) scale(1.18)}
  #stage[data-scene="networking"] .leanA{transform:rotate(5deg)}
  #stage[data-scene="networking"] .leanB{transform:rotate(-5deg)}
  #stage[data-scene="question"] .posA{transform:translate(40px,610px) scale(1.18)}
  #stage[data-scene="question"] .posB{transform:translate(240px,610px) scale(1.18)}
  #stage[data-scene="outro"] .posA{transform:translate(98px,722px) scale(.8)}
  #stage[data-scene="outro"] .posB{transform:translate(266px,722px) scale(.8)}

  @media (prefers-reduced-motion: reduce){.stage-wrap *{animation-duration:.01s !important;transition-duration:.01s !important}}
</style>
</head>
<body>
<div class="stage-wrap">
<svg id="stage" viewBox="0 0 540 960" data-scene="intro" role="img" aria-label="Animacja SHE BALANCE Women Camp">
  <defs>
    /*DEFS*/
    <g id="logoSign" fill="currentColor"><g transform="scale(0.1) translate(-711,-738)">/*LOGO*/</g></g>
    <g id="bottle"><rect x="-13" y="-30" width="26" height="62" rx="10" fill="#dfeee9"/><rect x="-13" y="-6" width="26" height="22" fill="#A4B8B0"/><rect x="-8" y="-42" width="16" height="13" rx="3" fill="#58756C"/><rect x="-7" y="-24" width="4" height="40" rx="2" fill="#fff" opacity=".6"/></g>
    <g id="avocado"><path d="M0,-30 C14,-30 22,-4 22,10 C22,26 12,34 0,34 C-12,34 -22,26 -22,10 C-22,-4 -14,-30 0,-30 Z" fill="#58756C"/><path d="M0,-24 C10,-24 16,-2 16,10 C16,22 9,28 0,28 C-9,28 -16,22 -16,10 C-16,-2 -10,-24 0,-24 Z" fill="#d6e2a8"/><circle cy="12" r="10" fill="#8a5a3c"/><circle cx="-3" cy="9" r="3" fill="#fff" opacity=".35"/></g>
    <g id="strawberry"><path d="M0,26 C-18,14 -20,-4 -14,-12 C-8,-18 8,-18 14,-12 C20,-4 18,14 0,26 Z" fill="#e0675a"/><path d="M-12,-12 L-4,-8 L0,-16 L4,-8 L12,-12 L6,-4 L-6,-4 Z" fill="#6f8f5e"/><g fill="#f7d98b"><circle cx="-6" cy="0" r="1.3"/><circle cx="5" cy="2" r="1.3"/><circle cx="-2" cy="9" r="1.3"/><circle cx="7" cy="11" r="1.3"/><circle cx="-8" cy="11" r="1.3"/></g></g>
  </defs>

  <rect id="bg" width="540" height="960" fill="#A4B8B0"/>
  <circle id="wipe" cx="270" cy="480" r="1150" fill="#A4B8B0"/>
  <g id="dust"></g>

  <g id="cam">
  <!-- ================= TYŁ SCEN ================= -->
  <g class="scene" data-s="intro">
    <circle cx="270" cy="390" r="60" fill="none" stroke="#fff" class="burst" style="animation-delay:.35s"/>
    <circle cx="270" cy="390" r="60" fill="none" stroke="#fff" class="burst" style="animation-delay:.55s"/>
  </g>
  <g class="scene" data-s="selfdev">
    <g class="sunRise"><g transform="translate(270,690)">
      <g class="spin" fill="#E3CCC1" opacity=".7">
        <rect x="-4" y="-270" width="8" height="80" rx="4"/><rect x="-4" y="-270" width="8" height="80" rx="4" transform="rotate(30)"/><rect x="-4" y="-270" width="8" height="80" rx="4" transform="rotate(60)"/><rect x="-4" y="-270" width="8" height="80" rx="4" transform="rotate(90)"/><rect x="-4" y="-270" width="8" height="80" rx="4" transform="rotate(120)"/><rect x="-4" y="-270" width="8" height="80" rx="4" transform="rotate(150)"/>
        <rect x="-4" y="-270" width="8" height="80" rx="4" transform="rotate(180)"/><rect x="-4" y="-270" width="8" height="80" rx="4" transform="rotate(210)"/><rect x="-4" y="-270" width="8" height="80" rx="4" transform="rotate(240)"/><rect x="-4" y="-270" width="8" height="80" rx="4" transform="rotate(270)"/><rect x="-4" y="-270" width="8" height="80" rx="4" transform="rotate(300)"/><rect x="-4" y="-270" width="8" height="80" rx="4" transform="rotate(330)"/>
      </g>
      <circle r="165" fill="#E3CCC1"/><circle r="205" fill="#E3CCC1" opacity=".35"/>
    </g></g>
  </g>
  <g class="scene" data-s="networking">
    <g stroke="#58756C" stroke-width="1.6" fill="#58756C">
      <path class="draw" pathLength="1" fill="none" d="M80,470 L180,410 L290,450 L440,400 M180,410 L230,530 L290,450 M80,470 L230,530 L370,545 L440,400 M290,450 L370,545 M440,400 L480,500 L370,545"/>
      <circle cx="80" cy="470" r="6" class="pop d1"/><circle cx="180" cy="410" r="5" class="pop d1"/><circle cx="290" cy="450" r="8" class="pop d2"/>
      <circle cx="440" cy="400" r="5" class="pop d2"/><circle cx="230" cy="530" r="6" class="pop d3"/><circle cx="370" cy="545" r="5" class="pop d3"/><circle cx="480" cy="500" r="4" class="pop d4"/>
    </g>
  </g>
  <g class="scene" data-s="camp">
    <circle cx="430" cy="360" r="34" fill="#F2EFEB" class="pop d2"/><circle cx="444" cy="352" r="30" fill="#58756C" class="pop d2"/>
    <g fill="#fff" id="campStars"></g>
    <path class="mtn" d="M-20,640 L90,470 L170,560 L270,420 L380,560 L450,490 L560,640 Z" fill="#4a655c"/>
    <path class="mtn d1" d="M250,437 L270,420 L292,452 L278,446 L270,456 L260,446 Z M78,488 L90,470 L104,490 L94,486 Z" fill="#F2EFEB" opacity=".85"/>
    <path class="mtn d2" d="M-20,660 L60,560 L150,630 L240,540 L340,640 L430,570 L560,660 Z" fill="#3e564e"/>
    <g transform="translate(96,610)"><g class="pop d3">
      <path d="M-58,30 L0,-46 L58,30 Z" fill="#E3CCC1"/><path d="M0,-46 L-16,30 L16,30 Z" fill="#6E5446"/><path d="M0,-46 L0,-58" stroke="#E3CCC1" stroke-width="3"/><path d="M0,-58 l14,6 l-14,6 Z" fill="#E0CCC0"/>
    </g></g>
    <g transform="translate(456,626)"><g class="pop d4">
      <ellipse cy="10" rx="34" ry="8" fill="#6E5446"/>
      <path class="flame" d="M0,10 C-22,-4 -12,-30 0,-48 C12,-30 22,-4 0,10 Z" fill="#e8a24a"/>

      <circle r="70" fill="#e8a24a" opacity=".12"/>

  </g>
  <g class="scene" data-s="question">

  <g class="scene" data-s="outro">
    <circle cx="270" cy="870" r="240" fill="#fff" opacity=".08"/><circle cx="270" cy="870" r="175" fill="#fff" opacity=".08"/>
  </g>

  <!-- ================= POSTACIE ================= -->
/*CHARS*/

  <!-- ================= PRZÓD SCEN ================= -->
  <g class="scene" data-s="intro" fill="#fff" text-anchor="middle">
    <use href="#logoSign" x="270" y="390" class="logoPop" style="color:#fff;transform-box:fill-box"/>
    <text x="270" y="530" font-size="46" class="thin split" style="--d0:.45s">SHE BALANCE</text>
    <text x="270" y="572" font-size="14" class="caps rise d4" letter-spacing=".5em">Women Camp</text>
    <text x="270" y="640" font-size="30" class="serif rise d5">przestrzeń dla kobiet</text>
  </g>

  <g class="scene" data-s="meet" fill="#333333" text-anchor="middle">

      <g transform="translate(270,520)"><g class="pop d4"><use href="#star" transform="scale(1.1)"/></g></g>
      <g transform="translate(420,560)"><g class="pop d5"><use href="#star" transform="scale(1.6)"/></g></g>
      <g transform="translate(90,420)"><use href="#star" class="twinkle"/></g>
      <g transform="translate(460,400)"><use href="#star" class="twinkle" style="animation-delay:-.6s"/></g>
    </g>
    <g fill="#E3CCC1">
      <g transform="translate(200,600)"><use href="#heartShape" class="heart"/></g>
      <g transform="translate(340,610)"><use href="#heartShape" class="heart" style="animation-delay:-1.1s"/></g>

  </g>

  <g class="scene" data-s="healthy" fill="#333333" text-anchor="middle">
    <text x="270" y="140" font-size="15" class="caps rise">01</text>
    <text x="270" y="235" font-size="92" class="serif split" style="--d0:.05s">healthy</text>

  <g class="scene" data-s="networking" fill="#333333" text-anchor="middle">

    <text x="270" y="235" font-size="78" class="serif split" style="--d0:.05s">networking</text>
    <text x="270" y="288" font-size="15" class="caps rise d4">kobiety, które się wspierają</text>
    <g transform="translate(120,380)"><g class="pop d3" style="transform-origin:0% 100%"><rect x="0" y="-26" width="104" height="40" rx="20" fill="#fff"/><path d="M14,12 l-6,14 l18,-12 Z" fill="#fff"/><text x="52" y="2" font-size="22" class="serif">cześć!</text></g></g>
    <g transform="translate(320,420)"><g class="pop d4" style="transform-origin:100% 100%"><rect x="0" y="-26" width="96" height="40" rx="20" fill="#fff"/><path d="M82,12 l6,14 l-18,-12 Z" fill="#fff"/><text x="48" y="2" font-size="22" class="serif">kawa?</text></g></g>
    <g transform="translate(200,500)"><g class="pop d5" style="transform-origin:50% 100%"><rect x="-8" y="-26" width="146" height="40" rx="20" fill="#58756C"/><text x="65" y="2" font-size="22" class="serif" fill="#fff">razem raźniej</text></g></g>

  <g class="scene" data-s="selfdev" fill="#333333" text-anchor="middle">

    <g transform="translate(270,410)"><g class="pop d3"><g class="float">
      <path d="M0,-4 C-20,-16 -44,-16 -60,-10 L-60,30 C-44,24 -20,24 0,36 Z" fill="#fbf7ef" stroke="#c9b797" stroke-width="1.5"/>
      <path d="M0,-4 C20,-16 44,-16 60,-10 L60,30 C44,24 20,24 0,36 Z" fill="#fbf7ef" stroke="#c9b797" stroke-width="1.5"/>
      <path d="M-50,2 q20,-6 40,2 M-50,12 q20,-6 40,2 M10,2 q20,-6 40,-2 M10,12 q20,-6 40,-2" stroke="#d4c6ac" stroke-width="1.5" fill="none"/>
    </g></g></g>
    <g transform="translate(75,590)">
      <path class="grow d2" d="M0,0 C-4,-40 6,-70 0,-110" stroke="#58756C" stroke-width="4" fill="none" stroke-linecap="round"/>
      <g transform="translate(0,-60)"><g class="pop d4"><use href="#leaf" transform="rotate(-50) scale(1.4)" fill="#6f8f5e"/></g></g>

<div class="bar"><i id="prog"></i></div>
<div class="controls">
  <button id="play">Pauza</button>
  <button id="restart">Od początku</button>
  <div class="dots" id="dots"></div>
</div>

<script>
const scenes=[
  {id:'intro',d:2.4,bg:'#A4B8B0',o:[270,480]},
  {id:'meet',d:3.2,bg:'#F2EFEB',o:[270,960]},
  {id:'healthy',d:2.8,bg:'#D3DED9',o:[0,300]},
  {id:'networking',d:2.8,bg:'#E3CCC1',o:[540,300]},
  {id:'selfdev',d:2.8,bg:'#F4F2EF',o:[270,700]},
  {id:'camp',d:3.0,bg:'#58756C',o:[270,0]},
  {id:'autumn',d:3.0,bg:'#6E5446',o:[540,960]},
  {id:'question',d:2.4,bg:'#E0CCC0',o:[0,960]},
  {id:'outro',d:3.8,bg:'#58756C',o:[270,480]}
];
let acc=0; scenes.forEach(s=>{s.t0=acc; acc+=s.d;}); const total=acc;
const NS='http://www.w3.org/2000/svg';
const stage=document.getElementById('stage'), bg=document.getElementById('bg'), wipe=document.getElementById('wipe'), cam=document.getElementById('cam');
const prog=document.getElementById('prog'), dots=document.getElementById('dots'), playBtn=document.getElementById('play');
let seed=11; const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;

// pył unoszący się w powietrzu
const dust=document.getElementById('dust');
for(let i=0;i<26;i++){const c=document.createElementNS(NS,'circle');
  c.setAttribute('cx',(rnd()*540).toFixed(0));c.setAttribute('cy',(300+rnd()*700).toFixed(0));c.setAttribute('r',(1.2+rnd()*2.6).toFixed(1));
  c.setAttribute('fill','#fff');c.setAttribute('class','dust');const d=5+rnd()*6;c.style.animationDuration=d+'s';c.style.animationDelay=(-rnd()*d)+'s';dust.appendChild(c);}
// liście
const leaves=document.getElementById('leaves'), leafColors=['#e8b04e','#d9743d','#b8502f','#f0c979','#E3CCC1','#A4B8B0'];
for(let i=0;i<26;i++){const g=document.createElementNS(NS,'g');g.setAttribute('transform',`translate(${(rnd()*560-10).toFixed(0)},0)`);
  const u=document.createElementNS(NS,'use');u.setAttribute('href','#leaf');u.setAttribute('fill',leafColors[i%leafColors.length]);u.setAttribute('class','leafFall');
  const d=2.6+rnd()*2.6;u.style.animationDuration=d+'s';u.style.animationDelay=(-rnd()*d)+'s';u.style.scale=(1+rnd()*1.3).toFixed(2);g.appendChild(u);leaves.appendChild(g);}
// gwiazdy nad campem
const cs=document.getElementById('campStars');
for(let i=0;i<22;i++){const g=document.createElementNS(NS,'g');g.setAttribute('transform',`translate(${(rnd()*540).toFixed(0)},${(i%4? 320+rnd()*150 : 30+rnd()*60).toFixed(0)}) scale(${(.3+rnd()*.5).toFixed(2)})`);
  const u=document.createElementNS(NS,'use');u.setAttribute('href','#star');u.setAttribute('class','twinkle');u.style.animationDelay=(-rnd()*1.4)+'s';g.appendChild(u);cs.appendChild(g);}
// konfetti
const conf=document.getElementById('confetti'), cc=['#fff','#E3CCC1','#A4B8B0','#F2EFEB','#e8b04e'];
for(let i=0;i<40;i++){const a=rnd()*Math.PI*2, r=140+rnd()*220; const e=document.createElementNS(NS, i%3?'rect':'circle');
  if(i%3){e.setAttribute('x',-4);e.setAttribute('y',-7);e.setAttribute('width',8);e.setAttribute('height',14);e.setAttribute('rx',2);} else e.setAttribute('r',4.5);
  e.setAttribute('fill',cc[i%cc.length]);e.setAttribute('class','conf');
  e.style.cssText=`--dx:${(Math.cos(a)*r).toFixed(0)}px;--dy:${(Math.sin(a)*r+160).toFixed(0)}px;--dr:${(rnd()*720-360).toFixed(0)}deg;animation-delay:${(.15+rnd()*.25).toFixed(2)}s`;conf.appendChild(e);}

// napisy litera po literze
function splitText(){
  document.querySelectorAll('text.split').forEach(t=>{
    const g=document.createElementNS(NS,'g'); const n=t.getNumberOfChars(); const cls=t.getAttribute('class').replace('split','').trim();
    for(let i=0;i<n;i++){const ch=t.textContent[i]; if(ch===' ') continue; const p=t.getStartPositionOfChar(i);
      const c=document.createElementNS(NS,'text'); c.textContent=ch; c.setAttribute('x',p.x.toFixed(2)); c.setAttribute('y',p.y.toFixed(2));
      c.setAttribute('font-size',t.getAttribute('font-size')); c.setAttribute('text-anchor','start'); c.setAttribute('class',cls+' ch');
      if(t.getAttribute('fill')) c.setAttribute('fill',t.getAttribute('fill'));
      c.style.cssText=(t.getAttribute('style')||'')+`;--i:${i}`; g.appendChild(c);}
    t.replaceWith(g);
  });
}

scenes.forEach((s,i)=>{const b=document.createElement('button');b.setAttribute('aria-label','Scena '+(i+1));b.onclick=()=>{t=s.t0+.001;};dots.appendChild(b);});

function restart(el,cls){el.classList.remove(cls);void el.getBoundingClientRect();el.classList.add(cls);}
let current=-1;
function show(i){
  const prev=current; current=i; const s=scenes[i];
  stage.dataset.scene=s.id;
  bg.setAttribute('fill', prev<0? s.bg : scenes[prev].bg);
  wipe.setAttribute('fill',s.bg); wipe.setAttribute('cx',s.o[0]); wipe.setAttribute('cy',s.o[1]); wipe.style.transformOrigin=`${s.o[0]}px ${s.o[1]}px`;
  restart(wipe,'go'); cam.style.animationDuration=s.d+'s'; restart(cam,'go');
  document.querySelectorAll('.hop').forEach(h=>restart(h,'go'));
  document.querySelectorAll('.scene').forEach(el=>el.classList.toggle('active',el.dataset.s===s.id));
  [...dots.children].forEach((d,j)=>d.classList.toggle('on',j===i));
}
const sceneAt=t=>{let i=0;while(i<scenes.length-1&&t>=scenes[i+1].t0)i++;return i;};

// tryb renderowania klatek: deterministyczne ustawienie czasu
window.renderAt=function(sec){
  const i=sceneAt(sec); if(i!==current) show(i);
  getComputedStyle(stage).opacity;
  const local=(sec-scenes[i].t0)*1000;
  document.getAnimations().forEach(a=>{a.pause(); const el=a.effect&&a.effect.target;
    const rel = a instanceof CSSTransition || (el && (el.closest && (el.closest('.scene')||el.closest('#cam')===el||el.id==='wipe'||el.classList.contains('hop'))));
    a.currentTime = rel ? local : sec*1000; });
};

const params=new URLSearchParams(location.search);
let t=0,last=performance.now(),playing=!params.has('render');
if(params.has('rec')||params.has('render')) document.body.classList.add('rec');
document.fonts.ready.then(()=>{
  splitText(); window.ready=true;
  if(params.has('render')) return;
  const q=params.get('scene'); if(q){const s=scenes.find(s=>s.id===q); if(s) t=s.t0+.001;}
  function frame(now){ if(playing){t+=(now-last)/1000; if(t>=total){t=0;current=-1;}} last=now;
    const i=sceneAt(t); if(i!==current) show(i); prog.style.width=(t/total*100)+'%'; requestAnimationFrame(frame);}
  requestAnimationFrame(frame);
});
playBtn.onclick=()=>{playing=!playing;playBtn.textContent=playing?'Pauza':'Odtwórz';document.getAnimations().forEach(a=>playing?a.play():a.pause());};
document.getElementById('restart').onclick=()=>{t=0;current=-1;};
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();playBtn.click();}});
window.SCENES=scenes; window.TOTAL=total;
</script>
</body>
</html>
