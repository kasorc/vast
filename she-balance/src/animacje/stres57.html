<script>
window.SCENES=[{id:'liczba',d:1,bg:'#3f524c'},{id:'chaos',d:3.5,bg:'#3f524c'},{id:'polowa',d:2.5,bg:'#3f524c'},{id:'zatrzymanie',d:3,bg:'#D7D3CB'},{id:'shebalance',d:6,bg:'#F2EFEB'},{id:'zaproszenie',d:4,bg:'#F2EFEB'}];
// Teksty .wsplit → osobne <text> na słowo (albo na grupy znaków z data-g="0,9,19"), zmienna --w = numer słowa.
window.beforeSplit=function(){
  const NS='http://www.w3.org/2000/svg';
  document.querySelectorAll('text.wsplit').forEach(t=>{
    const s=t.textContent, cls=t.getAttribute('class').replace('wsplit','').trim(), g=document.createElementNS(NS,'g');
    let st=[]; if(t.dataset.g) st=t.dataset.g.split(',').map(Number); else for(let i=0;i<s.length;i++) if(s[i]!==' '&&(i===0||s[i-1]===' ')) st.push(i);
    const hl=(t.dataset.hl||'').split(',').filter(x=>x!=='').map(Number);
    st.forEach((a,k)=>{const b=k<st.length-1?st[k+1]:s.length; const p=t.getStartPositionOfChar(a);
      const c=document.createElementNS(NS,'text'); c.textContent=s.slice(a,b).trimEnd(); c.setAttribute('x',p.x.toFixed(2)); c.setAttribute('y',p.y.toFixed(2));
      ['font-size','fill','opacity'].forEach(x=>{if(t.getAttribute(x)) c.setAttribute(x,t.getAttribute(x));}); c.setAttribute('text-anchor','start');
      c.setAttribute('class',(cls+' w'+(hl.includes(k)?' hl':'')).trim()); c.style.cssText=(t.getAttribute('style')||'')+';--w:'+k; g.appendChild(c);});
    t.replaceWith(g);
  });
};
</script>
