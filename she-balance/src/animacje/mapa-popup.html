<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SheBalance – Mapa, która się rozkłada</title>
<style>
  /*FONTS*/
  :root{--page:#F4F2EF;--ink:#333;--muted:#6B6B6B}
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--ink);font-family:"Mulish",system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px;gap:14px}
  .stage-wrap{width:min(100%, calc((100vh - 110px) * 9 / 16));aspect-ratio:9/16;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.18)}
  svg#stage{width:100%;height:100%;display:block}
  .controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .controls button{font:inherit;background:none;border:1px solid var(--muted);color:var(--ink);padding:6px 14px;cursor:pointer;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
  .dots{display:flex;gap:6px}.dots button{width:10px;height:10px;padding:0;border-radius:50%;border:1px solid var(--muted);background:none}.dots button.on{background:var(--ink)}
  .bar{width:min(100%,360px);height:3px;background:rgba(127,127,127,.25)}.bar i{display:block;height:100%;width:0;background:var(--ink)}
  body.rec{padding:0;gap:0} body.rec .stage-wrap{width:100vw;height:100vh;box-shadow:none} body.rec .controls,body.rec .bar{display:none}
  /*BASE_CSS*/
  /*FIG_CSS*/

  /* ================= MAPA, KTÓRA SIĘ ROZKŁADA – style ================= */
  /* twarde cięcia – przejścia robimy sami (nurkowanie, iris, kartkowanie, whip-pan) */
  .scene{transition:none}
  #cam.go{animation:none}
  :root{--in:cubic-bezier(.2,.9,.25,1.15);--out:cubic-bezier(.6,0,.8,.2);--io:cubic-bezier(.65,0,.35,1);--soft:cubic-bezier(.3,.7,.3,1)}
  .fig .headWrap{transform-origin:110px 205px}
  .sans{font-family:"Mulish",sans-serif;font-weight:600}
  .bold{font-family:"Mulish",sans-serif;font-weight:700}

  /* wycinanki: wstawanie od dołu z cieniem */
  .up,.upSh,.down,.pinDrop,.popC{transform-box:fill-box}
  .up,.down{transform-origin:50% 100%}
  .scene.active .up{animation:upY .7s var(--in) both;animation-delay:var(--dl,0s)}
  @keyframes upY{0%{transform:scaleY(0)}68%{transform:scaleY(1.03)}84%{transform:scaleY(.97)}100%{transform:scaleY(1)}}
  .shG{transform-box:fill-box;transform-origin:0 100%}
  .scene.active .shG{animation:shG .8s var(--soft) both;animation-delay:var(--dl)}
  @keyframes shG{from{transform:scaleX(0);opacity:0}to{transform:none;opacity:1}}
  .scene.active .down{animation:downY .45s var(--out) both;animation-delay:var(--dl,0s)}
  @keyframes downY{0%{transform:scaleY(1)}100%{transform:scaleY(0);opacity:0}}
  .popC{transform-origin:50% 50%}
  .scene.active .popC{animation:popC .5s var(--in) both;animation-delay:var(--dl,0s)}
  @keyframes popC{from{transform:scale(0);opacity:0}to{transform:none;opacity:1}}
  .scene.active .fadeIn{animation:fadeIn .25s ease both;animation-delay:var(--dl,0s)}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .twk{animation:twk 1.7s steps(1) infinite}
  @keyframes twk{0%{opacity:1}40%{opacity:.15}62%{opacity:1}80%{opacity:.3}}

  /* tarasy gór */
  .ter .top,.ter .side,.ter .cast{transform-box:view-box}
  .scene.active .ter.rise .top{animation:terTop .9s var(--in) both;animation-delay:var(--dl)}
  .scene.active .ter.rise .side{animation:terSide .9s var(--in) both;animation-delay:var(--dl)}
  .scene.active .ter.rise .cast{animation:castIn .9s ease both;animation-delay:var(--dl)}
  @keyframes castIn{from{opacity:0}to{opacity:.12}}
  @keyframes terTop{from{transform:translateY(0);fill-opacity:0;stroke-opacity:0}to{transform:translateY(var(--lift));fill-opacity:1;stroke-opacity:1}}
  @keyframes terSide{from{transform:translateY(0);opacity:0}to{transform:translateY(var(--liftS));opacity:1}}
  .scene.active .ter.fall .top{animation:terTopF .5s var(--out) both;animation-delay:var(--dl)}
  .scene.active .ter.fall .side,.scene.active .ter.fall .cast{animation:terSideF .5s var(--out) both;animation-delay:var(--dl)}
  @keyframes terTopF{from{transform:translateY(var(--lift))}90%{fill-opacity:0}to{transform:translateY(0);fill-opacity:0;opacity:0}}
  @keyframes terSideF{from{transform:translateY(var(--liftS))}to{transform:translateY(0);opacity:0}}
  .ter.still .top{transform:translateY(var(--lift))} .ter.still .side{transform:translateY(var(--liftS))}

  /* etykiety tekstu (papierowe metki) */
  .tagSh{opacity:.2}

  /* ---------- 1. ROZŁOŻENIE ---------- */
  .scene.active #cam1{animation:cam1 2.6s both}
  @keyframes cam1{
    0%{transform:translate(270px,500px) scale(.42) translate(-630px,-800px);animation-timing-function:var(--io)}
    38%{transform:translate(270px,500px) scale(.38) translate(-630px,-800px);animation-timing-function:var(--io)}
    60%{transform:translate(270px,500px) scale(.40) translate(-600px,-800px);animation-timing-function:var(--io)}
    78%{transform:translate(270px,500px) scale(.54) translate(-420px,-800px);animation-timing-function:cubic-bezier(.6,0,.35,1)}
    100%{transform:translate(270px,500px) scale(1.5) translate(-290px,-760px)}}
  .fRback,.fRfront{transform-origin:840px 0} .fLback,.fLfront{transform-origin:420px 0}
  .s1.active .fRback{animation:foldAway .34s var(--out) 0s both}
  .s1.active .fRfront{animation:foldOpen .5s var(--in) .34s both}
  .s1.active .fLback{animation:foldAway .3s var(--out) .46s both}
  .s1.active .fLfront{animation:foldOpen .5s var(--in) .76s both}
  @keyframes foldAway{from{transform:scaleX(1)}to{transform:scaleX(0)}}
  @keyframes foldOpen{0%{transform:scaleX(0)}70%{transform:scaleX(1.03)}100%{transform:scaleX(1)}}
  .s1.active .fRfront .crease{animation:crease .6s ease .44s both} .s1.active .fLfront .crease{animation:crease .6s ease .82s both}
  @keyframes crease{from{opacity:.28}to{opacity:0}}
  .scene.active .grey1{animation:grey1 2.6s both}
  @keyframes grey1{0%,78%{opacity:0}97%,100%{opacity:1}}
  .needle{transform-origin:175px 175px}
  .scene.active .needle{animation:needle 1.5s cubic-bezier(.2,.7,.3,1) .7s both}
  @keyframes needle{0%{transform:rotate(-600deg)}62%{transform:rotate(14deg)}78%{transform:rotate(-6deg)}90%{transform:rotate(2deg)}100%{transform:rotate(0)}}
  .scene.active .hand1{animation:hand1 2.6s both}
  @keyframes hand1{0%,34%{transform:translate(1800px,1000px);animation-timing-function:var(--soft)}
    50%,60%{transform:translate(1085px,930px);animation-timing-function:var(--out)}
    76%,100%{transform:translate(1850px,1020px)}}
  .scene.active .pen1{animation:pen1 2.6s both}
  @keyframes pen1{0%,34%{transform:translate(1800px,1000px) rotate(0);animation-timing-function:var(--soft)}
    50%,58%{transform:translate(1085px,930px) rotate(0);animation-timing-function:var(--io)}
    66%,100%{transform:translate(1080px,944px) rotate(10deg)}}
  .scene.active .b1pos{animation:b1pos 2.6s both}
  @keyframes b1pos{0%{transform:translateY(24px)}14%,76%{transform:none;animation-timing-function:cubic-bezier(.55,0,.9,.4)}100%{transform:translate(-60px,430px) scale(1.3)}}
  .scene.active .figB.b1 .armL{animation:b1L 2.6s var(--io) both}
  @keyframes b1L{0%,31%{transform:rotate(174deg)}45%{transform:rotate(150deg)}52%,100%{transform:rotate(153deg)}}
  .scene.active .figB.b1 .armR{animation:b1R 2.6s var(--io) both}
  @keyframes b1R{0%,17%{transform:rotate(-174deg)}31%{transform:rotate(-150deg)}38%,100%{transform:rotate(-153deg)}}
  .figB.b1 .foreL{transform:rotate(-8deg)} .figB.b1 .foreR{transform:rotate(8deg)}
  .scene.active .figB.b1 .headWrap{animation:b1H 2.6s var(--io) both}
  @keyframes b1H{0%,50%{transform:rotate(0)}62%,100%{transform:rotate(-5deg)}}
  .scene.active .t1a{transform-box:fill-box;transform-origin:50% 50%;animation:t1a 1.2s both}
  @keyframes t1a{0%{transform:scale(1.12);animation-timing-function:var(--soft)}78%{transform:scale(1);animation-timing-function:var(--out)}90%,100%{transform:scaleY(0)}}
  .scene.active .t1b{transform-box:fill-box;transform-origin:50% 50%;animation:t1b 2.6s both}
  @keyframes t1b{0%,41.5%{transform:scaleY(0);animation-timing-function:var(--in)}48%,86%{transform:none;opacity:1}94%,100%{opacity:0;transform:translateY(-24px)}}

  /* ---------- 2. MIASTO ---------- */
  .scene.active .mini{transform-box:fill-box;transform-origin:50% 100%;animation:miniLife 1.55s var(--io) .3s both}
  .scene.active .mini.mB{animation-delay:.4s}
  @keyframes miniLife{0%{transform:scaleY(0)}18%{transform:scaleY(1.04)}26%,86%{transform:scaleY(1)}100%{transform:scaleY(0)}}
  .figA.phoneA .armR{transform:rotate(5deg)} .figA.phoneA .headWrap{transform:rotate(5deg) translateY(5px)}
  .scene.active .figA.phoneA .foreR{animation:scroll .5s ease-in-out infinite alternate}
  @keyframes scroll{from{transform:rotate(152deg)}to{transform:rotate(160deg)}}
  .figB.stompB .armL{transform:rotate(30deg)} .figB.stompB .foreL{transform:rotate(-80deg)}
  .figB.stompB .armR{transform:rotate(-30deg)} .figB.stompB .foreR{transform:rotate(80deg)}
  .scene.active .figB.stompB .legR{animation:stomp .4s ease-in-out infinite}
  @keyframes stomp{0%,100%{transform:translateY(0)}40%{transform:translateY(-26px)}58%{transform:translateY(2px)}}
  .scene.active .figB.stompB .headWrap{animation:impat .8s ease-in-out infinite alternate}
  @keyframes impat{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
  .scene.active .bub{transform-box:fill-box;transform-origin:50% 100%;animation:bub var(--bd,1.9s) both;animation-delay:var(--dl)}
  @keyframes bub{0%{transform:scale(0);opacity:0;animation-timing-function:var(--in)}22%{transform:scale(1);opacity:1}82%{transform:scale(1);opacity:1;animation-timing-function:var(--out)}100%{transform:scale(0);opacity:0}}
  .scene.active .pinDrop{transform-origin:50% 100%;animation:pinDrop .7s cubic-bezier(.3,1.5,.5,1) both;animation-delay:var(--dl)}
  @keyframes pinDrop{0%{transform:translateY(-160px) scaleY(1.1);opacity:0}40%{opacity:1}75%{transform:translateY(0) scaleY(.93)}100%{transform:none}}
  .scene.active .busPop{transform-box:fill-box;transform-origin:50% 100%;animation:upY .6s var(--in) 2.0s both}
  .scene.active .t2{transform-box:fill-box;transform-origin:50% 50%;animation:stamp .45s cubic-bezier(.3,1.4,.5,1) .25s both}
  @keyframes stamp{from{transform:scale(1.45) rotate(-7deg);opacity:0}to{transform:rotate(-1.5deg);opacity:1}}
  .scene.active .t2out{animation:tOut .25s var(--out) 2.72s both}
  @keyframes tOut{to{opacity:0;transform:translateY(-10px)}}

  /* ---------- 3. TRASA ---------- */
  .rot3{transform-origin:270px 500px}
  .scene.active .rot3{animation:rot3 3.6s var(--io) both}
  @keyframes rot3{0%{transform:rotate(0)}33%{transform:rotate(4deg)}68%{transform:rotate(-4deg)}100%{transform:rotate(0)}}
  .scene.active .w3{animation:w3 .5s var(--in) both;animation-delay:var(--dl)}
  @keyframes w3{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
  .scene.active .tag3{transform-box:fill-box;transform-origin:0 50%;animation:tag3 .4s var(--in) 0s both}
  @keyframes tag3{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .scene.active .t3out{animation:tOut .25s var(--out) 3.3s both}
  .busWave{transform-box:fill-box;transform-origin:50% 100%;animation:bw .3s ease-in-out infinite alternate}
  @keyframes bw{from{transform:rotate(-25deg)}to{transform:rotate(25deg)}}

  /* ---------- 4. BESKIDY ---------- */
  .scene.active .grey4{animation:grey4 1.1s ease .15s both}
  @keyframes grey4{to{opacity:0}}
  .hopA,.hopB{transform-origin:110px 712px}
  .scene.active .hopA{animation:stepOut .85s ease-in-out .5s both}
  .scene.active .hopB{animation:stepOut .85s ease-in-out .75s both}
  @keyframes stepOut{0%{transform:translate(var(--sx),0);opacity:0}12%{opacity:1}25%{transform:translate(calc(var(--sx)*.74),-22px)}45%{transform:translate(calc(var(--sx)*.46),0)}65%{transform:translate(calc(var(--sx)*.2),-22px)}84%{transform:translate(0,0) scale(1.03,.97)}100%{transform:none}}
  .scene.active .hopA .legL,.scene.active .hopB .legL{animation:stepL .42s ease-in-out 2;animation-delay:inherit}
  .scene.active .hopA .legL{animation-delay:.5s} .scene.active .hopA .legR{animation:stepL .42s ease-in-out .71s 2}
  .scene.active .hopB .legL{animation-delay:.75s} .scene.active .hopB .legR{animation:stepL .42s ease-in-out .96s 2}
  .scene.active .figA.a4 .armR{animation:a4R 3.8s var(--io) both}
  @keyframes a4R{0%,36%{transform:rotate(-7deg)}44%,100%{transform:rotate(-148deg)}}
  .scene.active .figA.a4 .foreR{animation:waveF .36s ease-in-out 1.55s infinite alternate}
  .scene.active .figB.b4 .armL{animation:b4L 3.8s var(--io) both}
  @keyframes b4L{0%,40%{transform:rotate(7deg)}49%,62%{transform:rotate(166deg)}70%,100%{transform:rotate(158deg)}}
  .scene.active .figB.b4 .armR{animation:b4R 3.8s var(--io) both}
  @keyframes b4R{0%,40%{transform:rotate(-7deg)}49%,62%{transform:rotate(-166deg)}70%,100%{transform:rotate(-42deg)}}
  .scene.active .figB.b4 .body{animation:b4B 3.8s var(--io) both}
  @keyframes b4B{0%,62%{transform:rotate(0)}70%,100%{transform:rotate(-8deg)}}
  .figB.b4 .foreL{transform:rotate(12deg)} .figB.b4 .foreR{transform:rotate(-8deg)}
  .scene.active .sunStick{transform-box:fill-box;transform-origin:50% 100%;animation:sunStick 3.8s both}
  @keyframes sunStick{0%,30%{transform:scaleY(0)}40%{transform:scaleY(1.04) rotate(0)}50%{transform:rotate(-5deg)}65%{transform:rotate(4deg)}80%{transform:rotate(-3deg)}100%{transform:rotate(2deg)}}
  .scene.active .mist{animation:mist 3.8s var(--io) both}
  @keyframes mist{from{transform:translateX(var(--mx0));opacity:0}25%{opacity:.85}to{transform:translateX(var(--mx1));opacity:.85}}
  .pinHead{transform-box:fill-box;transform-origin:50% 50%}
  .scene.active .pinHead{animation:pinHead .34s cubic-bezier(.7,0,.9,.5) 3.46s both}
  @keyframes pinHead{from{transform:scale(1)}to{transform:scale(36)}}
  .scene.active .t4{transform-box:fill-box;transform-origin:50% 0;animation:t4 3.8s both}
  @keyframes t4{0%,12%{transform:translateY(-40px) rotate(3deg);opacity:0;animation-timing-function:var(--in)}24%{transform:rotate(-1deg);opacity:1}60%{opacity:1;transform:rotate(-1deg)}66%,100%{opacity:0;transform:translateY(-12px) rotate(-1deg)}}
  .scene.active .t4 .ch{--d0:.42s}

  /* ---------- 5. TRZY POP-UPY DNIA ---------- */
  .page{transform-origin:0 480px}
  .scene.active .pg1{animation:flip .42s var(--out) 1.78s both}
  .scene.active .pg2{animation:flip .42s var(--out) 3.58s both}
  .scene.active .pg3{animation:flip .38s var(--out) 5.12s both}
  @keyframes flip{from{transform:scaleX(1)}to{transform:scaleX(0)}}
  .scene.active .pg1 .shade{animation:shade .42s var(--out) 1.78s both}
  .scene.active .pg2 .shade{animation:shade .42s var(--out) 3.58s both}
  .scene.active .pg3 .shade{animation:shade .38s var(--out) 5.12s both}
  @keyframes shade{from{opacity:0}to{opacity:.45}}
  .scene.active .iris5{animation:iris5 .55s var(--io) both}
  @keyframes iris5{from{r:0}to{r:760px}}
  .scene.active .pin1in{transform-origin:270px 520px;animation:push5 2.3s var(--soft) both}
  .scene.active .pin2in{transform-origin:270px 480px;animation:push5 2.3s var(--soft) 1.7s both}
  .scene.active .pin3in{transform-origin:270px 600px;animation:pull5 2s var(--soft) 3.5s both}
  @keyframes push5{from{transform:scale(1)}to{transform:scale(1.07)}}
  @keyframes pull5{from{transform:scale(1.1) translateY(-12px)}to{transform:scale(1)}}
  .scene.active .par1{animation:par 2.3s var(--soft) both} .scene.active .par2{animation:par 2.3s var(--soft) both;--px:-26px} .scene.active .par3{animation:par 2.3s var(--soft) both;--px:30px}
  @keyframes par{from{transform:translateX(0)}to{transform:translateX(var(--px,-12px))}}
  .scene.active .sunUp{animation:sunUp 2s var(--soft) both}
  @keyframes sunUp{from{transform:translateY(70px)}to{transform:none}}
  .scene.active .mistB{animation:mistB 3s ease-in-out infinite alternate}
  @keyframes mistB{from{transform:translateX(-30px)}to{transform:translateX(30px)}}
  .fig.bend .foreL{transform:rotate(12deg)} .fig.bend .foreR{transform:rotate(-12deg)}
  .scene.active .fig.bend .armL{animation:bdL 1.2s var(--io) infinite}
  .scene.active .fig.bend .armR{animation:bdR 1.2s var(--io) infinite}
  .scene.active .fig.bend .body{animation:bdB 1.2s var(--io) infinite}
  .scene.active .fig.bend.late .armL,.scene.active .fig.bend.late .armR,.scene.active .fig.bend.late .body{animation-delay:-.6s}
  @keyframes bdL{0%,35%,100%{transform:rotate(168deg)}50%,85%{transform:rotate(160deg)}}
  @keyframes bdR{0%,35%,100%{transform:rotate(-168deg)}50%,85%{transform:rotate(-48deg)}}
  @keyframes bdB{0%,35%,100%{transform:rotate(0)}50%,85%{transform:rotate(-9deg)}}
  .figA.a5b .armR{transform:rotate(-34deg)} .figA.a5b .headWrap{transform:rotate(7deg) translateY(4px)}

  @keyframes write{from{transform:rotate(-10deg)}to{transform:rotate(-20deg)}}

  @keyframes nod{from{transform:rotate(-5deg)}to{transform:rotate(2deg) translateY(2px)}}
  .scene.active .figB.b5c .body{animation:lean5 5.5s var(--io) both}
  @keyframes lean5{0%,67%{transform:rotate(0)}78%,100%{transform:rotate(-7deg)}}
  .scene.active .figB.b5c .headWrap{animation:lean5h 5.5s var(--io) both}
  @keyframes lean5h{0%,69%{transform:rotate(0)}80%,100%{transform:rotate(-13deg)}}
  .scene.active .figA.a5c .headWrap{animation:lean5a 5.5s var(--io) both}
  @keyframes lean5a{0%,74%{transform:rotate(0)}88%,100%{transform:rotate(5deg)}}
  .swing{transform-box:view-box}
  .scene.active .swing{animation:swing 2.2s ease-in-out infinite alternate;animation-delay:var(--dl)}
  @keyframes swing{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
  .scene.active .tx5{animation:tx5 .5s var(--in) both;animation-delay:var(--dl)}

  @keyframes hangIn{0%{transform:translateY(-240px) rotate(-10deg);animation-timing-function:cubic-bezier(.3,.8,.4,1)}45%{transform:rotate(4deg);animation-timing-function:ease-in-out}72%{transform:rotate(-1.5deg)}100%{transform:none}}
  @keyframes chType{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
  .scene.active .glow{animation:glow 1.6s ease-in-out infinite alternate}
  @keyframes glow{from{opacity:.35}to{opacity:.7}}

  /* ---------- 6. MAPA SIĘ SKŁADA ---------- */
  .whip6{transform-origin:272px 527px}
  .scene.active .whip6{animation:whip6 3.7s both}
  @keyframes whip6{0%,82%{transform:none;animation-timing-function:cubic-bezier(.6,0,.85,.5)}100%{transform:scale(7)}}
