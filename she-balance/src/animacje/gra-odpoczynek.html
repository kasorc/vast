<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SheBalance – Poziom: Odpoczynek</title>
<style>
  /*FONTS*/
  :root{--page:#F4F2EF;--ink:#333;--muted:#6B6B6B}
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--ink);font-family:"Mulish",system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px;gap:14px}
  .stage-wrap{width:min(100%, calc((100vh - 110px) * 9 / 16));aspect-ratio:9/16;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.18)}
  svg#stage{width:100%;height:100%;display:block}
  .controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .controls button{font:inherit;background:none;border:1px solid var(--muted);color:var(--ink);padding:6px 14px;cursor:pointer;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
  .dots{display:flex;gap:6px}.dots button{width:10px;height:10px;padding:0;border-radius:50%;border:1px solid var(--muted);background:none}.dots button.on{background:var(--ink)}
  .bar{width:min(100%,360px);height:3px;background:rgba(127,127,127,.25)}.bar i{display:block;height:100%;width:0;background:var(--ink)}
  body.rec{padding:0;gap:0} body.rec .stage-wrap{width:100vw;height:100vh;box-shadow:none} body.rec .controls,body.rec .bar{display:none}
  /*BASE_CSS*/
  /*FIG_CSS*/

  /* ================= MINI-GRA „Poziom: Odpoczynek” ================= */
  /* sceny przełączają się twardo – każde przejście jest zbudowane wewnątrz scen (iris, whip-pan, mgła, liść, cień bossa, koło, iris-out) */
  .scene{transition:none}
  #cam.go{animation:none}
  /* typografia gry */
  .cp{font-family:"Mulish",sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.14em}
  .mu{font-family:"Mulish",sans-serif;font-weight:700}
  .mu6{font-family:"Mulish",sans-serif;font-weight:600}
  /* paralaksa: pętla przesuwu tła za idącą postacią (jedyny ruch liniowy) */
  .px{animation:pxL var(--T,6s) linear infinite}
  @keyframes pxL{to{transform:translateX(-540px)}}
  .wv{animation:wv 1.6s linear infinite} @keyframes wv{to{stroke-dashoffset:-140}}
  .mist{animation:mist 5s ease-in-out infinite alternate} .mist.r{animation-direction:alternate-reverse;animation-duration:6.5s}
  @keyframes mist{from{transform:translateX(-26px)}to{transform:translateX(26px)}}
  .bob{animation:bob 1.3s ease-in-out infinite alternate} @keyframes bob{from{transform:translateY(-5px)}to{transform:translateY(5px)}}
  .dt{animation:dt .9s ease-in-out infinite} @keyframes dt{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
  .vib{animation:vib .07s ease-in-out infinite alternate} @keyframes vib{from{transform:translateX(-2.5px) rotate(-3deg)}to{transform:translateX(2.5px) rotate(3deg)}}
  .flipP{transform-origin:0 -12px;animation:flipP .45s cubic-bezier(.5,0,.5,1) infinite} @keyframes flipP{0%{transform:scaleY(1)}50%{transform:scaleY(-.05)}100%{transform:scaleY(-1);opacity:.0}}
  .halo{transform-box:fill-box;transform-origin:center;animation:halo 1.4s ease-in-out infinite alternate} @keyframes halo{from{transform:scale(.9);opacity:.5}to{transform:scale(1.08);opacity:.95}}
  .rays{transform-origin:270px 560px;animation:spin 40s linear infinite}
  /* cząsteczki (JS generuje, czas liczony od początku sceny) */
  .scene.active .spk{animation:spk .65s cubic-bezier(.1,.7,.3,1) both}
  @keyframes spk{0%{opacity:0;transform:translate(0,0) scale(.2)}8%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.9) rotate(120deg)}}
  .scene.active .shard{animation:shard .75s cubic-bezier(.1,.7,.3,1) both}
  @keyframes shard{0%{opacity:0;transform:translate(0,0)}4%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--dr))}}
  .scene.active .lf7{animation:lf7 2.2s cubic-bezier(.15,.6,.4,1) both}
  @keyframes lf7{0%{opacity:0;transform:translate(0,0) rotate(0) scale(.4)}6%{opacity:1}45%{transform:translate(calc(var(--dx)*.75),var(--dy)) rotate(calc(var(--dr)*.5)) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(var(--dx),calc(var(--dy) + 170px)) rotate(var(--dr)) scale(.9)}}
  .scene.active .ring{transform-box:fill-box;transform-origin:center;animation:ringB .55s cubic-bezier(.2,.7,.3,1) both}
  @keyframes ringB{0%{opacity:0;transform:scale(.2)}12%{opacity:1}100%{opacity:0;transform:scale(2.4)}}
  .scene.active .p10{transform-box:fill-box;transform-origin:center;animation:p10 .85s cubic-bezier(.2,.8,.3,1) both}
  @keyframes p10{0%{opacity:0;transform:translateY(12px) scale(.7)}18%{opacity:1;transform:translateY(0) scale(1.04)}70%{opacity:1;transform:translateY(-16px) scale(1)}100%{opacity:0;transform:translateY(-26px)}}
  .scene.active .sm6{transform-box:fill-box;transform-origin:center;animation:sm6 .55s cubic-bezier(.2,.6,.3,1) both}
  @keyframes sm6{0%{opacity:0;transform:translateY(0) scale(.5,.6)}22%{opacity:.75}100%{opacity:0;transform:translateY(-120px) scale(1.5,1.3)}}
  .scene.active .ex6{animation:ex6 .6s cubic-bezier(.2,.7,.3,1) both}
  @keyframes ex6{0%{opacity:0;stroke-dashoffset:.55}15%{opacity:.95}100%{opacity:0;stroke-dashoffset:-1}}
  .scene.active .ob{animation:ob 1.24s both}
  @keyframes ob{0%{transform:translateX(640px);opacity:1;animation-timing-function:cubic-bezier(.35,0,.75,.75)}80.6%{transform:translateX(150px);animation-timing-function:cubic-bezier(.2,.5,.5,1)}98%{transform:translateX(55px);opacity:1}100%{transform:translateX(52px);opacity:0}}
  /* tytuły – różne wejścia liter */
  .scene.active .ch.t1{animation:chDrop .62s cubic-bezier(.25,1,.4,1) both;animation-delay:calc(var(--d0,0s) + var(--i)*45ms)}
  @keyframes chDrop{0%{opacity:0;transform:translateY(-70px) rotate(8deg)}55%{opacity:1;transform:translateY(3px) rotate(-1deg)}78%{transform:translateY(-1.5px)}100%{opacity:1;transform:none}}
  .scene.active .ch.br6{animation:chBr .75s cubic-bezier(.2,.7,.3,1) both;animation-delay:calc(var(--d0,0s) + var(--i)*42ms)}
  @keyframes chBr{0%{opacity:0;transform:translateY(22px) scale(.92)}100%{opacity:1;transform:none}}
  .scene.active .dot8{transform-box:fill-box;transform-origin:center;animation:dot8 .45s cubic-bezier(.2,.9,.25,1.12) both;animation-delay:calc(.12s + var(--i)*22ms)}
  @keyframes dot8{from{opacity:0;transform:scale(0)}to{opacity:1;transform:none}}
  .dpu{transform-box:fill-box;transform-origin:center;animation:dpu 1.3s ease-in-out infinite;animation-delay:calc(var(--k)*-90ms)}
  @keyframes dpu{0%,100%{transform:scale(.55);opacity:.55}50%{transform:scale(1);opacity:1}}
  .logo8{stroke-dasharray:var(--L,6000);stroke-dashoffset:var(--L,6000)}
</style>
</head>
<body>
<div class="stage-wrap">
<svg id="stage" viewBox="0 0 540 960">
  <defs>/*DEFS*/
    <linearGradient id="skyA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4F2EF"/><stop offset=".55" stop-color="#EFE5DF"/><stop offset=".75" stop-color="#E3CCC1"/></linearGradient>
    <linearGradient id="skyB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E3CCC1"/><stop offset=".45" stop-color="#F2EFEB"/><stop offset=".72" stop-color="#F4F2EF"/></linearGradient>
    <linearGradient id="skyC" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A4B8B0"/><stop offset=".62" stop-color="#C9D3CC"/><stop offset=".8" stop-color="#E3CCC1"/></linearGradient>
    <linearGradient id="skyD" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E6CB8E"/><stop offset=".42" stop-color="#EFE3C8"/><stop offset=".62" stop-color="#F2EFEB"/></linearGradient>
    <linearGradient id="shadowTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f3f3a" stop-opacity=".75"/><stop offset="1" stop-color="#2f3f3a" stop-opacity="0"/></linearGradient>
    <radialGradient id="glowM" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#D4A23A" stop-opacity=".45"/><stop offset="1" stop-color="#D4A23A" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowC" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#F4F2EF" stop-opacity=".95"/><stop offset="1" stop-color="#F4F2EF" stop-opacity="0"/></radialGradient>
    <filter id="whip" x="-30%" y="-5%" width="160%" height="110%"><feGaussianBlur stdDeviation="16 0"/></filter>
    <filter id="fogBlur" x="-20%" y="-10%" width="140%" height="120%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
    <!-- mgła do przejścia (prostokąt z miękkimi, „kłębiastymi” krawędziami z obu stron) -->
    <g id="fogWall" fill="#F4F2EF">
      <rect x="0" y="-80" width="1000" height="1120"/>
      <circle cx="0" cy="-20" r="90"/><circle cx="-20" cy="120" r="110"/><circle cx="10" cy="270" r="85"/><circle cx="-30" cy="410" r="120"/><circle cx="5" cy="560" r="90"/><circle cx="-25" cy="700" r="115"/><circle cx="0" cy="850" r="95"/><circle cx="-15" cy="990" r="110"/>
      <circle cx="1000" cy="40" r="100"/><circle cx="1020" cy="200" r="90"/><circle cx="990" cy="350" r="115"/><circle cx="1025" cy="500" r="95"/><circle cx="995" cy="650" r="110"/><circle cx="1020" cy="800" r="90"/><circle cx="1000" cy="950" r="115"/>
    </g>
    <!-- ikony power-upów (cienka linia ciemnej zieleni, płaskie wypełnienia z palety) -->
    <g id="icoTea">
      <path d="M-17,-8 L17,-8 L14,15 Q13,20 8,20 L-8,20 Q-13,20 -14,15 Z" fill="#F4F2EF" stroke="#58756C" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M16,-3 q10,0 9,9 q-1,7 -11,7" fill="none" stroke="#58756C" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M-15,1 L15,1" stroke="#D4A23A" stroke-width="3"/>
      <path d="M-4,-8 L-4,-17" stroke="#58756C" stroke-width="1.5"/><rect x="-7" y="-23" width="6" height="7" fill="#D4A23A"/>
      <path class="steam" d="M5,-12 q-4,-5 0,-10 q4,-5 0,-10" fill="none" stroke="#58756C" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    <g id="icoMat">
      <rect x="-22" y="-11" width="36" height="22" rx="4" fill="#A4B8B0" stroke="#58756C" stroke-width="2.2"/>
      <ellipse cx="14" cy="0" rx="8" ry="11" fill="#C4D1CB" stroke="#58756C" stroke-width="2.2"/>
      <path d="M14,0 m-3,0 a3,3.5 0 1,1 3,3.5 a6,7 0 1,1 5,-7" fill="none" stroke="#58756C" stroke-width="1.6"/>
      <path d="M-10,-11 L-10,11 M0,-11 L0,11" stroke="#58756C" stroke-width="1.5" opacity=".6"/>
    </g>
    <g id="icoCandle">
      <circle cx="0" cy="-16" r="16" fill="url(#glowM)"/>
      <rect x="-10" y="-6" width="20" height="28" rx="3" fill="#F4F2EF" stroke="#58756C" stroke-width="2.2"/>
      <path d="M-10,2 q5,4 10,0 q5,-4 10,0" fill="none" stroke="#58756C" stroke-width="1.4" opacity=".6"/>
      <path d="M0,-6 L0,-11" stroke="#58756C" stroke-width="1.6"/>
      <path class="flame" d="M0,-26 C5,-19 5,-13 0,-11 C-5,-13 -5,-19 0,-26 Z" fill="#D4A23A"/>
    </g>
    <g id="icoMug">
      <path d="M-8,-7 L8,-7 L7,6 Q6.5,9 3,9 L-3,9 Q-6.5,9 -7,6 Z" fill="none" stroke="#58756C" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M8,-4 q5,0 4.5,4.5 q-.5,3.5 -5,3.5" fill="none" stroke="#58756C" stroke-width="1.6"/>
      <path d="M-3,-11 q-2,-3 0,-6 M2,-11 q-2,-3 0,-6" fill="none" stroke="#58756C" stroke-width="1.3" stroke-linecap="round"/>
    </g>
    <path id="pebble" d="M-32,-14 C-32,-34 -10,-44 6,-43 C24,-42 34,-30 33,-16 C32,-4 20,0 0,0 C-20,0 -32,-3 -32,-14Z"/>
  </defs>
  <rect id="bg" width="540" height="960" fill="#F2EFEB"/>
  <circle id="wipe" cx="270" cy="480" r="1150" fill="#F2EFEB"/>
  <g id="cam">

    <!-- ============ 2. BATERIA 7% (2,0–5,5) ============ -->
    <g class="scene" data-s="bateria">
      <g>
        <g class="whip2">
          <g class="cam2">
            <rect x="-300" y="-300" width="1140" height="1560" fill="url(#skyA)"/>
            <circle cx="398" cy="330" r="80" fill="url(#glowC)"/><circle cx="398" cy="330" r="44" fill="#F4F2EF"/>
            <g class="px" style="--T:26s"><g id="s2far"></g></g>
            <g class="px" style="--T:13s"><g id="s2mid"></g></g>
            <g class="px" style="--T:6.5s"><g id="s2tree"></g></g>
            <rect x="-300" y="700" width="1140" height="400" fill="#A4B8B0"/>
            <rect x="-300" y="706" width="1140" height="34" fill="#E3CCC1"/>
            <g class="px" style="--T:3.2s"><g id="s2peb"></g></g>
            <!-- szary przystanek autobusowy (codzienność) -->
            <g class="bus2"><g transform="translate(40,712)" fill="#A9A7A3">
              <rect x="-6" y="-190" width="7" height="190"/><rect x="104" y="-190" width="7" height="190"/>
              <path d="M-22,-196 L128,-196 L120,-210 L-14,-210Z" fill="#8E8C88"/>
              <rect x="4" y="-178" width="96" height="120" fill="#C9C7C3" opacity=".55"/>
              <rect x="10" y="-60" width="84" height="7" rx="2" fill="#8E8C88"/><rect x="18" y="-53" width="5" height="53"/><rect x="82" y="-53" width="5" height="53"/>
              <rect x="-50" y="-150" width="4" height="150"/><circle cx="-48" cy="-162" r="17" fill="#F4F2EF" stroke="#8E8C88" stroke-width="3"/>
              <rect x="-57" y="-170" width="18" height="12" rx="2" fill="#8E8C88"/><circle cx="-53" cy="-156" r="2" fill="#8E8C88"/><circle cx="-43" cy="-156" r="2" fill="#8E8C88"/>
            </g></g>
            <g transform="translate(180,712)"><g class="bIn2"><g class="lean2"><g transform="scale(.42) translate(-110,-712)">/*FIG_B:walk has-pack heavy*/</g></g></g></g>
            <!-- szara chmurka „…” nad B -->
            <g transform="translate(234,380)"><g class="cl2">
              <circle cx="-38" cy="40" r="4" fill="#BDBBB6"/><circle cx="-28" cy="28" r="6.5" fill="#BDBBB6"/>
              <path d="M-26,8 C-34,-6 -18,-20 -6,-14 C0,-28 24,-26 26,-12 C40,-12 42,8 28,12 C24,22 -18,24 -26,8Z" fill="#CFCDC8"/>
              <circle class="dt" cx="-8" cy="0" r="3.4" fill="#6B6B6B"/><circle class="dt" style="animation-delay:.15s" cx="4" cy="0" r="3.4" fill="#6B6B6B"/><circle class="dt" style="animation-delay:.3s" cx="16" cy="0" r="3.4" fill="#6B6B6B"/>
            </g></g>
            <g class="px" style="--T:2.3s"><g id="s2fg"></g></g>
          </g>
          <g class="lvl2">
            <text x="270" y="250" text-anchor="middle" class="serif" font-size="42" fill="#333">Wyjazd z codzienności</text>
          </g>
          <g transform="translate(270,262)"><g class="warn2">
            <rect x="-206" y="-44" width="412" height="88" rx="20" fill="#F4F2EF" stroke="#58756C" stroke-width="1.5"/>
            <path d="M-168,-16 L-150,16 L-186,16Z" fill="none" stroke="#B5582F" stroke-width="2.4" stroke-linejoin="round"/>
            <path d="M-168,-5 L-168,6" stroke="#B5582F" stroke-width="2.4" stroke-linecap="round"/><circle cx="-168" cy="11" r="1.5" fill="#B5582F"/>
            <text x="-134" y="-8" font-size="18" class="cp" fill="#B5582F">Uwaga:</text>
            <text x="-134" y="22" font-size="22" class="mu" fill="#333">zbyt wiele ról jednocześnie</text>
          </g></g>
        </g>
      </g>
    </g>

    <!-- ============ 3. PRZESZKODY (5,5–10,0) ============ -->
    <g class="scene" data-s="przeszkody">
      <g class="whip3">
        <g class="cam3">
          <rect x="-300" y="-300" width="1140" height="1560" fill="url(#skyA)"/>
          <circle cx="420" cy="300" r="80" fill="url(#glowC)"/><circle cx="420" cy="300" r="40" fill="#F4F2EF"/>

          <g class="px" style="--T:9.5s"><g id="s3mid"></g></g>
          <g class="px" style="--T:4.6s"><g id="s3tree"></g></g>
          <rect x="-300" y="718" width="1140" height="400" fill="#A4B8B0"/>
          <rect x="-300" y="724" width="1140" height="36" fill="#E3CCC1"/>
          <g class="px" style="--T:2.3s"><g id="s3peb"></g></g>
          <!-- przeszkody: koperta 99+, wibrujący telefon, kalendarz -->
          <g transform="translate(0,652)"><g class="ob" style="animation-delay:-.15s"><g class="bob"><g transform="scale(1.6)"><circle r="42" fill="#F4F2EF" opacity=".92" stroke="#58756C" stroke-width="1" stroke-opacity=".5"/>
            <rect x="-36" y="-25" width="72" height="50" rx="6" fill="#F4F2EF" stroke="#58756C" stroke-width="2.2"/>
            <path d="M-35,-22 L0,5 L35,-22" fill="none" stroke="#58756C" stroke-width="2.2" stroke-linejoin="round"/>
            <circle cx="33" cy="-25" r="16" fill="#B5582F"/><text x="33" y="-20.5" font-size="12.5" text-anchor="middle" class="mu" fill="#F4F2EF">99+</text>
          </g></g></g></g>
          <g transform="translate(0,652)"><g class="ob" style="animation-delay:1.05s"><g class="vib"><g transform="scale(1.6)"><circle r="42" fill="#F4F2EF" opacity=".92" stroke="#58756C" stroke-width="1" stroke-opacity=".5"/>
            <rect x="-22" y="-38" width="44" height="76" rx="9" fill="#58756C"/>
            <rect x="-17" y="-30" width="34" height="56" rx="3" fill="#F4F2EF"/>
            <rect x="-13" y="-24" width="26" height="9" rx="3" fill="#A4B8B0"/><rect x="-13" y="-11" width="26" height="9" rx="3" fill="#A4B8B0"/><rect x="-13" y="2" width="18" height="9" rx="3" fill="#A4B8B0"/>
            <path d="M-32,-14 q-6,14 0,28 M32,-14 q6,14 0,28" fill="none" stroke="#8E8C88" stroke-width="2.2" stroke-linecap="round"/>
          </g></g></g></g>
          <g transform="translate(0,652)"><g class="ob" style="animation-delay:2.25s"><g class="bob"><g transform="scale(1.6)"><circle r="42" fill="#F4F2EF" opacity=".92" stroke="#58756C" stroke-width="1" stroke-opacity=".5"/>
            <rect x="-34" y="-32" width="68" height="66" rx="7" fill="#F4F2EF" stroke="#58756C" stroke-width="2.2"/>
            <rect x="-34" y="-32" width="68" height="18" rx="7" fill="#58756C"/>
            <path d="M-18,-38 L-18,-26 M18,-38 L18,-26" stroke="#6E5446" stroke-width="3" stroke-linecap="round"/>
            <path d="M-22,-2 h10 M-4,-2 h10 M14,-2 h8 M-22,12 h10 M-4,12 h10 M14,12 h8 M-22,25 h10" stroke="#A4B8B0" stroke-width="5" stroke-linecap="round"/>
            <g transform="translate(0,-12)"><rect class="flipP" x="-32" y="0" width="64" height="44" fill="#E3CCC1" stroke="#58756C" stroke-width="1.2"/></g>
          </g></g></g></g>
          <g id="s3shards"></g>
          <g transform="translate(150,730)"><g class="jB3J"><g class="lean3"><g transform="scale(.5) translate(-110,-712)">/*FIG_B:walk has-pack jB3*/</g></g></g></g>
          <g transform="translate(212,346)"><g class="cl3">
            <circle cx="-38" cy="40" r="4" fill="#BDBBB6"/><circle cx="-28" cy="28" r="6.5" fill="#BDBBB6"/>
            <path d="M-26,8 C-34,-6 -18,-20 -6,-14 C0,-28 24,-26 26,-12 C40,-12 42,8 28,12 C24,22 -18,24 -26,8Z" fill="#CFCDC8"/>
            <circle class="dt" cx="-8" cy="0" r="3.4" fill="#6B6B6B"/><circle class="dt" style="animation-delay:.15s" cx="4" cy="0" r="3.4" fill="#6B6B6B"/><circle class="dt" style="animation-delay:.3s" cx="16" cy="0" r="3.4" fill="#6B6B6B"/>
          </g></g>
          <text class="p10" style="animation-delay:1.1s" x="214" y="352" font-size="24" text-anchor="middle" fill="#58756C" font-family="Mulish" font-weight="700">+10</text>
          <text class="p10" style="animation-delay:2.3s" x="214" y="352" font-size="24" text-anchor="middle" fill="#58756C" font-family="Mulish" font-weight="700">+10</text>
          <text class="p10" style="animation-delay:3.5s" x="214" y="352" font-size="24" text-anchor="middle" fill="#58756C" font-family="Mulish" font-weight="700">+10</text>
          <g class="px" style="--T:1.7s"><g id="s3fg"></g></g>
        </g>
        <text class="pp3a serif" x="270" y="250" font-size="58" text-anchor="middle" fill="#333">Unik!</text>
        <text class="pp3b serif" x="270" y="250" font-size="58" text-anchor="middle" fill="#333">Nie teraz.</text>

  const bez=(x1,y1,x2,y2)=>x=>{let lo=0,hi=1,t=x;for(let i=0;i<28;i++){const cx=3*x1*t*(1-t)*(1-t)+3*x2*t*t*(1-t)+t*t*t;if(cx<x)lo=t;else hi=t;t=(lo+hi)/2;}return 3*y1*t*(1-t)*(1-t)+3*y2*t*t*(1-t)+t*t*t;};
