<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SheBalance – Beat balansu</title>
<style>
  /*FONTS*/
  :root{--page:#F4F2EF;--ink:#333;--muted:#6B6B6B}
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--ink);font-family:"Mulish",system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px;gap:14px}
  .stage-wrap{width:min(100%, calc((100vh - 110px) * 9 / 16));aspect-ratio:9/16;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.18)}
  svg#stage{width:100%;height:100%;display:block}
  .controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .controls button{font:inherit;background:none;border:1px solid var(--muted);color:var(--ink);padding:6px 14px;cursor:pointer;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
  .dots{display:flex;gap:6px}.dots button{width:10px;height:10px;padding:0;border-radius:50%;border:1px solid var(--muted);background:none}.dots button.on{background:var(--ink)}
  .bar{width:min(100%,360px);height:3px;background:rgba(127,127,127,.25)}.bar i{display:block;height:100%;width:0;background:var(--ink)}
  body.rec{padding:0;gap:0} body.rec .stage-wrap{width:100vw;height:100vh;box-shadow:none} body.rec .controls,body.rec .bar{display:none}
  /*BASE_CSS*/
  /*FIG_CSS*/

  /* ================= BEAT BALANSU – 100 BPM: beat = 0,6 s, ósemka = 0,3 s, takt = 2,4 s ================= */
  /* Wszystkie czasy zdarzeń to wielokrotności 0,3 s. Elementy w .scene liczą czas od początku sceny,
     warstwy #grid i #letters – czas globalny filmu. */
  .lab{font-family:"Mulish",sans-serif;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
  /* cięcia na beat (twarde) – przenikają się tylko tła scen z siatką */
  .scene:not(.fadeBg){transition:none}

  /* ---------- kamera: #cam wyłączony; #gcam = jedna animacja 24 s (czas globalny), #beat = puls na beat (keyframes generowane przy starcie) ---------- */
  #stage #cam,#stage #cam.go{animation:none}
  #gcam{animation:gcam 24s linear both}
  #beat{animation:gbeat 24s linear both}
  /* ---------- słowa na beat ---------- */
  .scene.active .wd{transform-box:fill-box;transform-origin:50% 60%;animation:wdIn .3s cubic-bezier(.2,.9,.25,1.15) var(--t,0s) both}
  @keyframes wdIn{from{opacity:0;transform:scale(1.45)}to{opacity:1;transform:none}}
  .scene.active .wd.hook{animation-name:wdHook}
  @keyframes wdHook{from{opacity:.9;transform:scale(1.32)}to{opacity:1;transform:none}}
  .scene.active .outAt{animation:wdIn .3s cubic-bezier(.2,.9,.25,1.15) var(--t,0s) both, fadeOut .2s cubic-bezier(.6,0,.8,.2) var(--o) forwards}
  @keyframes fadeOut{to{opacity:0;transform:translateY(-10px)}}
  /* „Pauza.” – twarde wejście z rozmyciem ruchu */
  .scene.active .slam{transform-box:fill-box;transform-origin:50% 50%;animation:slam .3s cubic-bezier(.2,.9,.25,1.1) both, fadeOut .15s cubic-bezier(.6,0,.8,.2) 1.05s forwards}
  @keyframes slam{from{opacity:0;transform:scale(2.2);letter-spacing:.3em}to{opacity:1;transform:none;letter-spacing:.02em}}
  .scene.active .riseT{animation:riseT .45s cubic-bezier(.2,.9,.25,1.15) var(--t) both}
  @keyframes riseT{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
  /* „Gotowa?” – rozstrzelenie liter */
  .scene.active .track{transform-box:fill-box;transform-origin:50% 50%;animation:track .45s cubic-bezier(.2,.9,.25,1.1) both}
  @keyframes track{from{opacity:0;letter-spacing:.6em;transform:scaleX(1.2)}to{opacity:1;letter-spacing:.04em;transform:none}}
  /* odliczanie 3…2…1… (skala 1,4 → 1) */
  .scene.active .cnt{transform-box:fill-box;transform-origin:50% 55%;opacity:0;animation:cnt .6s linear var(--t) both}
  @keyframes cnt{0%{opacity:0;transform:scale(1.4);animation-timing-function:cubic-bezier(.2,.9,.25,1.1)}15%{opacity:1;transform:scale(1)}82%{opacity:1;transform:scale(.96);animation-timing-function:cubic-bezier(.6,0,.8,.2)}100%{opacity:0;transform:scale(.7)}}
  /* hasło wyłaniające się spod kamieni (maska od dołu) */
  .scene.active .reveal{animation:reveal .45s cubic-bezier(.2,.9,.25,1.1) var(--t) both}
  @keyframes reveal{from{opacity:0;transform:translateY(22px);clip-path:inset(0 0 100% 0)}to{opacity:1;transform:none;clip-path:inset(-20% 0 -20% 0)}}
  /* CTA – wjazd z boku */
  .scene.active .slideL{animation:slideL .4s cubic-bezier(.2,.9,.25,1.12) var(--t) both}
  .scene.active .slideR{animation:slideR .4s cubic-bezier(.2,.9,.25,1.12) var(--t) both}
  @keyframes slideL{from{opacity:0;transform:translateX(-70px)}to{opacity:1;transform:none}}
  @keyframes slideR{from{opacity:0;transform:translateX(70px)}to{opacity:1;transform:none}}
  .scene.active .btnIn{transform-box:fill-box;transform-origin:50% 50%;animation:pop .45s cubic-bezier(.3,1.5,.5,1) var(--t) both, btnP .6s cubic-bezier(.2,.7,.3,1) 4.2s 1}
  @keyframes btnP{0%{transform:scale(1.05)}100%{transform:scale(1)}}

  /* ---------- scena 1: sampler ---------- */
  .scene.active .pIn{transform-box:fill-box;transform-origin:50% 50%;animation:var(--pa,none)}
  .scene.active .pFl{opacity:0;animation:var(--pf,none)}
  .scene.active .pRing{transform-box:fill-box;transform-origin:50% 50%;opacity:0;animation:var(--pr,none)}
  @keyframes padHit{0%{transform:scale(.92)}35%{transform:scale(.92)}100%{transform:none}}
  @keyframes padFl{0%{opacity:.75}100%{opacity:0}}
  @keyframes padSoft{0%{opacity:.4}100%{opacity:0}}
  @keyframes padRing{0%{opacity:.9;transform:scale(.2)}100%{opacity:0;transform:scale(2.4)}}
  .scene.active .samp .foreL{animation:sampL 2.4s linear both}
  .scene.active .samp .foreR{animation:sampR 2.4s linear both}
  @keyframes sampL{0%{transform:rotate(-14deg);animation-timing-function:cubic-bezier(.2,.7,.3,1)}12.5%{transform:rotate(-62deg);animation-timing-function:cubic-bezier(.45,0,.55,1)}44%{transform:rotate(-66deg);animation-timing-function:cubic-bezier(.6,0,.9,.4)}50%{transform:rotate(-14deg);animation-timing-function:cubic-bezier(.2,.7,.3,1)}62.5%{transform:rotate(-60deg);animation-timing-function:cubic-bezier(.6,0,.9,.4)}75%{transform:rotate(-14deg);animation-timing-function:cubic-bezier(.2,.7,.3,1)}100%{transform:rotate(-40deg)}}
  @keyframes sampR{0%{transform:rotate(58deg);animation-timing-function:cubic-bezier(.6,0,.9,.4)}25%{transform:rotate(14deg);animation-timing-function:cubic-bezier(.2,.7,.3,1)}37.5%{transform:rotate(62deg);animation-timing-function:cubic-bezier(.45,0,.55,1)}69%{transform:rotate(64deg);animation-timing-function:cubic-bezier(.6,0,.9,.4)}75%{transform:rotate(14deg);animation-timing-function:cubic-bezier(.2,.7,.3,1)}100%{transform:rotate(40deg)}}
  .frontOnly .fig{visibility:hidden} .frontOnly .foreL,.frontOnly .foreR{visibility:visible}

  /* kiwanie głową na beat */
  .nod .headWrap{transform-origin:110px 205px;animation:nod .6s cubic-bezier(.45,0,.55,1) infinite}
  @keyframes nod{0%,100%{transform:translateY(4px) rotate(1.6deg)}50%{transform:translateY(-2px) rotate(-1deg)}}

  /* ---------- siatka 3×3 (warstwa globalna) ---------- */
  #grid{visibility:hidden}
  #stage[data-scene=pady] #grid,#stage[data-scene=pauza] #grid,#stage[data-scene=build] #grid,#stage[data-scene=drop] #grid{visibility:visible}
  #gridZoom{animation:gridIn .45s cubic-bezier(.2,.9,.25,1.05) 2.4s both}
  @keyframes gridIn{from{transform:translate(270px,640px) scale(.572) translate(-270px,-470px)}to{transform:none}}
  .win .wi{transform-origin:73px 90px;animation:winPop .45s cubic-bezier(.2,.9,.25,1.15) var(--on), winOut .45s linear 12s forwards}
  @keyframes winPop{from{transform:scale(.9)}to{transform:none}}
  @keyframes winOut{0%{transform:none;animation-timing-function:cubic-bezier(.5,0,.5,1)}33%{transform:scale(.3);animation-timing-function:cubic-bezier(.3,0,.8,.5)}100%{transform:translate(var(--ox),-980px) scale(.3) rotate(var(--or))}}
  .win .wf{animation:grey .12s ease-out 7.2s forwards, ungrey .3s ease-out var(--uf) forwards}
  .w4 .wf{animation:none}
  @keyframes grey{from{filter:grayscale(0) brightness(1)}to{filter:grayscale(1) brightness(1.04)}}
  @keyframes ungrey{from{filter:grayscale(1) brightness(1.25)}to{filter:grayscale(0) brightness(1)}}
  .win .cover{animation:coverOff .22s ease-out var(--on) forwards, coverOn .15s ease-in 12s forwards}
  @keyframes coverOff{to{opacity:0}} @keyframes coverOn{from{opacity:0}to{opacity:1}}
  .win .flash{opacity:0;animation:padFl .35s ease-out var(--on) forwards, padFl .35s ease-out var(--uf)}
  .win .ring{transform-box:fill-box;transform-origin:50% 50%;opacity:0;animation:padRing .6s cubic-bezier(.2,.7,.3,1) var(--on)}
  /* zamrożenie: gasimy „życie” postaci w pauzie (pętle akcji zatrzymują się same – kończą się dokładnie w 7,2 s) */
  #grid .fig .body{animation:figBreath 3.2s ease-in-out 0s 2.25 forwards, figBreath 3.2s ease-in-out var(--uf) infinite}
  #grid .eyes{animation:blink 3.4s linear 0s 2.117647 forwards, blink 3.4s linear var(--uf) infinite}
  #grid .tilt{animation:tilt 4.2s ease-in-out 0s 1.714286 forwards, tilt 4.2s ease-in-out var(--uf) infinite}
  #grid .sway{animation:sway 3.6s ease-in-out 0s 2 forwards, sway 3.6s ease-in-out var(--uf) infinite}
  #grid .pupils{animation:look 6s ease-in-out 0s 1.2 forwards, look 6s ease-in-out var(--uf) infinite}
  #grid .smile{animation:smile 4s ease-in-out 0s 1.8 forwards, smile 4s ease-in-out var(--uf) infinite}
  #grid .steam{animation:steam 1.8s ease-in-out 0s 4 forwards, steam 1.8s ease-in-out var(--uf) infinite}
  #grid .nod .headWrap{animation:nod .6s cubic-bezier(.45,0,.55,1) 0s 12 forwards, nod .6s cubic-bezier(.45,0,.55,1) var(--uf) infinite}
  #grid .w3 .eyes{animation:blink 3.4s linear 0s 2.117647 forwards, wink .3s cubic-bezier(.45,0,.55,1) 8.4s, blink 3.4s linear var(--uf) infinite}
  @keyframes wink{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.06)}}
  #grid .w8 .hp{transform-box:fill-box;transform-origin:50% 50%;animation:hpOff .35s cubic-bezier(.6,0,.8,.2) 9s forwards}
  @keyframes hpOff{to{transform:translate(18px,-150px) rotate(-18deg);opacity:0}}

  /* pętle w okienkach: 0% = kulminacja ruchu (to ona zostaje w „freeze”); 1. pętla kończy się w 7,2 s, 2. rusza przy odmrożeniu */
  .w0 .jumpB{transform-origin:110px 712px;animation:jumpB .6s linear 0s 12 forwards, jumpB .6s linear var(--uf) infinite}
  @keyframes jumpB{0%{transform:translateY(-70px);animation-timing-function:cubic-bezier(.5,0,.9,.6)}45%{transform:translateY(0) scale(1.03,.96);animation-timing-function:ease-out}55%{transform:translateY(0);animation-timing-function:cubic-bezier(.1,.5,.4,1)}100%{transform:translateY(-70px)}}
  .w0 .rope{transform-origin:110px 447px;animation:rope .6s linear 0s 12 forwards, rope .6s linear var(--uf) infinite}
  @keyframes rope{0%{transform:scaleY(1)}25%{transform:scaleY(.04)}50%{transform:scaleY(-1.5)}75%{transform:scaleY(-.04)}100%{transform:scaleY(1)}}
  .w0 .fig .shadow{display:none}
  .rp .armL{transform:rotate(18deg)} .rp .foreL{transform:rotate(-18deg)} .rp .armR{transform:rotate(-18deg)} .rp .foreR{transform:rotate(18deg)}
  .w0 .shd{transform-box:fill-box;transform-origin:50% 50%;animation:shd .6s linear 0s 12 forwards, shd .6s linear var(--uf) infinite}
  @keyframes shd{0%,100%{transform:scale(.6);opacity:.5}50%{transform:scale(1);opacity:1}}

  .hands2 .foreL{transform:rotate(-45deg)} .hands2 .foreR{transform:rotate(45deg)}
  .w1 .pot{transform-origin:62px 134px;animation:pot 1.2s cubic-bezier(.45,0,.55,1) 0s 6 forwards, pot 1.2s cubic-bezier(.45,0,.55,1) var(--uf) infinite}
  @keyframes pot{0%,100%{transform:rotate(28deg)}35%,65%{transform:rotate(0)}}
  .w1 .stream{animation:stream 1.2s linear 0s 6 forwards, stream 1.2s linear var(--uf) infinite}
  @keyframes stream{0%,100%{opacity:1}14%,86%{opacity:0}}

  .w2 .armA{transform-origin:6px 200px;animation:fiveA .6s linear 0s 12 forwards, fiveA .6s linear var(--uf) infinite}
  .w2 .armB{transform-origin:140px 200px;animation:fiveB .6s linear 0s 12 forwards, fiveB .6s linear var(--uf) infinite}
  @keyframes fiveA{0%,100%{transform:rotate(19deg)}0%{animation-timing-function:cubic-bezier(.2,.7,.3,1)}50%{transform:rotate(2deg);animation-timing-function:cubic-bezier(.6,0,.9,.4)}}
  @keyframes fiveB{0%,100%{transform:rotate(-19deg)}0%{animation-timing-function:cubic-bezier(.2,.7,.3,1)}50%{transform:rotate(-2deg);animation-timing-function:cubic-bezier(.6,0,.9,.4)}}
  .spark{transform-box:fill-box;transform-origin:50% 50%}
  .w2 .spark{animation:sparkL .6s linear 0s 12 forwards, sparkL .6s linear var(--uf) infinite}
  .w6 .spark{animation:sparkL 1.2s linear 0s 6 forwards, sparkL 1.2s linear var(--uf) infinite}
  @keyframes sparkL{0%,100%{opacity:1;transform:translate(0,0) scale(1)}40%{opacity:0;transform:translate(var(--sx),var(--sy)) scale(.3)}99%{opacity:0;transform:scale(.2)}}

  .w3 .mapL{transform-origin:57px 0;animation:mapF 1.2s linear 0s 6 forwards, mapF 1.2s linear var(--uf) infinite}
  .w3 .mapR{transform-origin:89px 0;animation:mapF 1.2s linear 0s 6 forwards, mapF 1.2s linear var(--uf) infinite}
  @keyframes mapF{0%{transform:scaleX(1)}40%{transform:scaleX(1);animation-timing-function:cubic-bezier(.6,0,.8,.3)}58%,80%{transform:scaleX(.05);animation-timing-function:cubic-bezier(.2,.9,.25,1.1)}100%{transform:scaleX(1)}}

  .w5 .foreR{animation:pen .6s ease-in-out 0s 12 forwards, pen .6s ease-in-out var(--uf) infinite}
  @keyframes pen{0%,50%,100%{transform:rotate(50deg)}25%{transform:rotate(57deg)}75%{transform:rotate(45deg)}}
  .w5 .ln{stroke-dasharray:44;animation:var(--la) 2.4s linear 0s 3 forwards, var(--la) 2.4s linear var(--uf) infinite}
  @keyframes ln1{0%,6%{stroke-dashoffset:0;opacity:1}8%{opacity:0;stroke-dashoffset:0}9%{stroke-dashoffset:44;opacity:0}10%{opacity:1;stroke-dashoffset:44}38%,100%{stroke-dashoffset:0;opacity:1}}
  @keyframes ln2{0%,6%{stroke-dashoffset:0;opacity:1}8%{opacity:0;stroke-dashoffset:0}9%,38%{stroke-dashoffset:44;opacity:0}39%{opacity:1;stroke-dashoffset:44}68%,100%{stroke-dashoffset:0;opacity:1}}
  @keyframes ln3{0%,6%{stroke-dashoffset:0;opacity:1}8%{opacity:0;stroke-dashoffset:0}9%,68%{stroke-dashoffset:44;opacity:0}69%{opacity:1;stroke-dashoffset:44}98%,100%{stroke-dashoffset:0;opacity:1}}

  .w6 .mugA{transform-origin:40px 150px;animation:mug 1.2s linear 0s 6 forwards, mug 1.2s linear var(--uf) infinite}
  @keyframes mug{0%,100%{transform:rotate(22deg)}0%{animation-timing-function:cubic-bezier(.2,.7,.3,1)}50%{transform:rotate(-8deg);animation-timing-function:cubic-bezier(.6,0,.9,.4)}}

  #grid .w7 .fig .body{animation:none}
  .w7 .treeW{transform-origin:110px 712px;animation:tree 1.2s ease-in-out 0s 6 forwards, tree 1.2s ease-in-out var(--uf) infinite}
  @keyframes tree{0%,100%{transform:rotate(-2.4deg)}50%{transform:rotate(2.4deg)}}
  #grid .w7 .foreL{animation:clapOL .3s ease-in-out var(--uf) infinite}
  #grid .w7 .foreR{animation:clapOR .3s ease-in-out var(--uf) infinite}
  @keyframes clapOL{0%,100%{transform:rotate(14deg)}50%{transform:rotate(-22deg)}}
  @keyframes clapOR{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(22deg)}}

  #grid .w8 .foreR{animation:wv .6s ease-in-out 0s 12 forwards, clapR .6s ease-in-out var(--uf) infinite}
  #grid .w8 .armR{animation:armClapR .3s cubic-bezier(.2,.9,.25,1.1) var(--uf) forwards}
  #grid .w8 .armL{animation:armClapL .3s cubic-bezier(.2,.9,.25,1.1) var(--uf) forwards}
  #grid .w8 .foreL{animation:clapL .6s ease-in-out var(--uf) infinite}
  @keyframes wv{0%,100%{transform:rotate(-42deg)}50%{transform:rotate(-8deg)}}
  @keyframes armClapR{from{transform:rotate(-145deg)}to{transform:rotate(-10deg)}}
  @keyframes armClapL{from{transform:rotate(7deg)}to{transform:rotate(10deg)}}
  @keyframes clapR{0%,100%{transform:rotate(62deg)}50%{transform:rotate(30deg)}}
  @keyframes clapL{0%,100%{transform:rotate(-62deg)}50%{transform:rotate(-30deg)}}

  .w4 .logoIn{transform-box:fill-box;transform-origin:50% 50%;opacity:0;animation:logoPop .6s cubic-bezier(.3,1.5,.5,1) 7.2s both, logoBr 1.2s ease-in-out 7.8s infinite, logoOut .3s cubic-bezier(.6,0,.8,.2) 10.2s forwards}
  @keyframes logoBr{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.04);opacity:1}}
  @keyframes logoOut{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(.4)}}
  .w4 .halo{opacity:0;animation:haloA .6s ease-out 7.2s forwards, haloB 1.2s ease-in-out 7.8s infinite, haloOut .3s ease-in 10.2s forwards}
  @keyframes haloA{to{opacity:.55}} @keyframes haloB{0%,100%{opacity:.4}50%{opacity:.7}} @keyframes haloOut{to{opacity:.25}}

  /* ---------- build-up: iskry ---------- */
  .scene.active .bsp{transform-box:fill-box;transform-origin:50% 50%;opacity:0;animation:bsp .45s cubic-bezier(.2,.7,.3,1) var(--t) both}
  @keyframes bsp{0%{opacity:1;transform:scale(.2) rotate(0)}40%{opacity:1;transform:scale(1.15) rotate(40deg)}100%{opacity:0;transform:scale(.4) rotate(90deg)}}

  /* ---------- drop: nocna polana ---------- */
  .scene.active .dropCam{transform-origin:270px 600px;animation:dropCam .6s cubic-bezier(.2,.8,.2,1) both}
  @keyframes dropCam{from{transform:scale(1.6)}to{transform:none}}
  .scene.active .dropFlash{opacity:0;animation:padFl .3s ease-out both}
  .bulb{transform-box:fill-box;transform-origin:50% 50%}
  .scene.active .bulbA{animation:bulb 1.2s cubic-bezier(.2,.7,.3,1) infinite}
  .scene.active .bulbB{animation:bulb 1.2s cubic-bezier(.2,.7,.3,1) -.6s infinite}
  @keyframes bulb{0%{opacity:1;transform:scale(1.15)}50%{opacity:.35;transform:scale(.85)}100%{opacity:1;transform:scale(1.15)}}
  .scene.active .riseUp{animation:riseUp .45s cubic-bezier(.2,.9,.25,1.08) var(--t,.3s) both}
  @keyframes riseUp{from{transform:translateY(var(--ry,460px))}to{transform:none}}
  .scene.active .dance .armL{animation:dArmL 2.4s linear infinite} .scene.active .dance .armR{animation:dArmR 2.4s linear infinite}
  .scene.active .dance .foreL{animation:dForeL 2.4s linear infinite} .scene.active .dance .foreR{animation:dForeR 2.4s linear infinite}
  .scene.active .dance .body{animation:dBody 2.4s linear infinite}
  @keyframes dArmL{0%,100%{transform:rotate(152deg)}0%,25%,50%,75%{animation-timing-function:cubic-bezier(.3,0,.15,1)}25%{transform:rotate(30deg)}50%{transform:rotate(165deg)}75%{transform:rotate(88deg)}}
  @keyframes dArmR{0%,100%{transform:rotate(-152deg)}0%,25%,50%,75%{animation-timing-function:cubic-bezier(.3,0,.15,1)}25%{transform:rotate(-30deg)}50%{transform:rotate(-30deg)}75%{transform:rotate(-88deg)}}
  @keyframes dForeL{0%,100%{transform:rotate(18deg)}0%,25%,50%,75%{animation-timing-function:cubic-bezier(.3,0,.15,1)}25%{transform:rotate(-100deg)}50%{transform:rotate(8deg)}75%{transform:rotate(88deg)}}
  @keyframes dForeR{0%,100%{transform:rotate(-18deg)}0%,25%,50%,75%{animation-timing-function:cubic-bezier(.3,0,.15,1)}25%{transform:rotate(100deg)}50%{transform:rotate(100deg)}75%{transform:rotate(-88deg)}}
  @keyframes dBody{0%,100%{transform:translateY(-8px) rotate(0)}0%,25%,50%,75%{animation-timing-function:cubic-bezier(.3,0,.15,1)}10%{transform:translateY(2px) rotate(0)}25%{transform:rotate(3deg)}50%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
  .scene.active .spinB{transform-origin:110px 400px;animation:spinB 4.8s linear both}
  @keyframes spinB{0%,37.5%{transform:scaleX(1)}38.9%,87.5%{transform:scaleX(-1)}88.9%,100%{transform:scaleX(1)}}

  /* ---------- outro: A rzuca B słuchawki ---------- */
  .scene.active .thrower .armR{animation:thArmR 2.4s linear both} .scene.active .thrower .foreR{animation:thForeR 2.4s linear both}
  .scene.active .thrower .armL{animation:thArmL 2.4s linear both} .scene.active .thrower .foreL{animation:thForeL 2.4s linear both}
  @keyframes thArmR{0%{transform:rotate(-166deg)}20%{transform:rotate(-172deg);animation-timing-function:cubic-bezier(.6,0,.9,.4)}27%{transform:rotate(-160deg);animation-timing-function:cubic-bezier(.2,.7,.3,1)}50%,100%{transform:rotate(-150deg)}}
  @keyframes thForeR{0%,20%{transform:rotate(-8deg)}27%{transform:rotate(20deg)}50%,100%{transform:rotate(-18deg)}}
  @keyframes thArmL{0%,37.5%{transform:rotate(7deg);animation-timing-function:cubic-bezier(.3,0,.15,1)}50%,100%{transform:rotate(150deg)}}
  @keyframes thForeL{0%,37.5%{transform:rotate(-6deg)}50%,100%{transform:rotate(18deg)}}
  .hpLand{transform-box:fill-box;transform-origin:50% 50%}
  .scene.active .hpLand{animation:hpLand 2.4s linear both}

<script>
// 100 BPM → beat 0,6 s; sceny = pełne takty (2,4 s), więc każdy start sceny wypada na „raz”.
window.SEED=404;
window.SCENES=[
  {id:'sampler',d:2.4,bg:'#F2EFEB'}, // takt 1   0,0–2,4
  {id:'pady',d:4.8},                 // takty 2–3 2,4–7,2
  {id:'pauza',d:2.4},                // takt 4   7,2–9,6
  {id:'build',d:2.4},                // takt 5   9,6–12,0
  {id:'drop',d:4.8},                 // takty 6–7 12,0–16,8
  {id:'outro',d:2.4},                // takt 8   16,8–19,2
  {id:'logo',d:4.8}                  // takt 9 logo 19,2–21,6 + takt 10 CTA 21,6–24,0
];
window.beforeSplit=function(){
  // ===== KAMERA (czas globalny). [czas, skala, ox, oy, obrót°, easing do następnego klucza]
  const EI='cubic-bezier(.45,0,.55,1)', EIN='cubic-bezier(.6,0,.9,.45)', EOUT='cubic-bezier(.2,.8,.2,1)', TOT=24;
  const CAM=[[0,1,270,640,0,EI],[2.1,1.045,270,640,0,EIN],[2.3995,1.3,270,640,0,'linear'],
    [2.4,1,270,470,0,EI],[7.2,1.03,270,470,0,EI],[9.6,1.045,270,470,0,EIN],[11.9995,1.065,270,470,0,'linear'],
    [12,1,270,620,0,EI],[12.6,1,270,620,0,EI]];
  for(let k=0;k<7;k++) CAM.push([13.2+k*.6,1,270,620,k%2?1:-1,EI]);
  CAM.push([16.7995,1,270,620,0,'linear'],[16.8,1,270,520,0,EI],[19.1995,1.07,270,520,0,'linear'],[19.2,1.07,270,440,0,EOUT],[21.6,1,270,440,0,EI],[24,1.045,270,440,0,EI]);
  const pc=t=>(t/TOT*100).toFixed(4)+'%';
  let css='@keyframes gcam{'+CAM.map(([t,sc,ox,oy,r,e])=>`${pc(t)}{transform:translate(${ox}px,${oy}px) rotate(${r}deg) scale(${sc}) translate(${-ox}px,${-oy}px);animation-timing-function:${e}}`).join('')+'}';
  // ===== PULS NA BEAT: [od, do, krok, amplituda]
  const B=[[0,7.2,.6,.022],[9.6,12,.3,.018],[12,19.2,.6,.03],[19.2,21.6,.6,.02],[21.6,24,.6,.012]]; const K=[];
  B.forEach(([a,b,st,am])=>{for(let t=a;t<b-1e-6;t+=st){K.push([t,1+am]);K.push([t+st-.002,1]);}});
  K.push([7.2,1],[9.5995,1]);
  K.sort((x,y)=>x[0]-y[0]);
  css+='@keyframes gbeat{'+K.map(([t,sc])=>`${pc(Math.min(t,TOT))}{transform:translate(270px,470px) scale(${sc}) translate(-270px,-470px);animation-timing-function:${sc>1?'cubic-bezier(.2,.7,.3,1)':'linear'}}`).join('')+'}';
  const st=document.createElement('style'); st.textContent=css; document.head.appendChild(st);

  const NS='http://www.w3.org/2000/svg', R=window.rnd;
  const el=(tag,attrs,parent)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;};
  // --- słowa w linii: wyśrodkowanie wg zmierzonych szerokości
  document.querySelectorAll('g.wl').forEach(g=>{const ts=[...g.children],gap=+g.dataset.gap||12;
    const w=ts.map(t=>t.getComputedTextLength()); const tot=w.reduce((a,b)=>a+b,0)+gap*(ts.length-1);
    let x=+g.dataset.cx-tot/2; ts.forEach((t,i)=>{t.setAttribute('x',x.toFixed(1));x+=w[i]+gap;});});
  // --- słuchawki: wkładamy do głowy postaci (podążają za kiwaniem głową)
  document.querySelectorAll('[data-hp]').forEach(h=>{const t=h.querySelector('.headWrap .tilt'); if(!t) return;
    const g=el('g',{class:'hp '+(h.dataset.hpc||'')},t); el('use',{href:'#hp'+h.dataset.hp},g);});
  // --- pady samplera (dokładnie geometria okien siatki → cięcie „pad → okno”)
  const cols=['#A4B8B0','#E3CCC1','#C9D6CF','#D9BFB1','#58756C','#B7C7C0','#E3CCC1','#A4B8B0','#D9BFB1'];
  const pads=document.getElementById('pads');
  // uderzenia: [pad, czas] – beaty 1–4 taktu 1 + ósemkowe „kroki sekwencera” w dolnych rzędach
  const hits={0:[0,1.2,1.8],2:[.6,1.8]}, soft={6:[.3],7:[.9],8:[1.5],3:[2.1],4:[2.1],5:[2.1],1:[2.1]};
  for(let k=0;k<9;k++){const x=41+(k%3)*156,y=190+Math.floor(k/3)*190;
    const g=el('g',{transform:`translate(${x},${y})`},pads), p=el('g',{class:'pIn'},g);
    el('rect',{width:146,height:180,rx:22,fill:cols[k]},p); el('rect',{width:146,height:180,rx:22,fill:'url(#padShine)'},p);
    el('rect',{x:10,y:10,width:126,height:160,rx:16,fill:'none',stroke:'#fff','stroke-opacity':.35,'stroke-width':3},p);
    const f=el('rect',{class:'pFl',width:146,height:180,rx:22,fill:'#fff'},p); const r=el('circle',{class:'pRing',cx:73,cy:90,r:70,fill:'none',stroke:'#fff','stroke-width':8},g);
    if(hits[k]){p.style.setProperty('--pa',hits[k].map(t=>`padHit .3s cubic-bezier(.2,.7,.3,1) ${t}s`).join(','));
      f.style.setProperty('--pf',hits[k].map(t=>`padFl .35s ease-out ${t}s`).join(','));
      r.style.setProperty('--pr',hits[k].map(t=>`padRing .6s cubic-bezier(.2,.7,.3,1) ${t}s`).join(','));}
    else if(soft[k]) f.style.setProperty('--pf',soft[k].map(t=>`padSoft .3s ease-out ${t}s`).join(','));
  }
  // --- iskry build-up: gęstnieją co ósemkę (1,1,2,2,3,3,4,4)
  const sp=document.getElementById('sparks'); const pts=[];
  [192,348].forEach(x=>[285,475,660].forEach(y=>pts.push([x,y]))); [375,565].forEach(y=>[70,120,420,470].forEach(x=>pts.push([x,y])));
  [1,1,2,2,3,3,4,4].forEach((n,k)=>{for(let j=0;j<n;j++){const p=pts[Math.floor(R()*pts.length)];
    const w=el('g',{transform:`translate(${(p[0]+(R()-.5)*14).toFixed(1)},${(p[1]+(R()-.5)*14).toFixed(1)}) scale(${(.8+R()*.6).toFixed(2)})`},sp); const u=el('use',{href:'#star',class:'bsp',fill:'#D4A23A'},w);
    u.style.setProperty('--t',(k*.3)+'s');}});
  // --- gwiazdy i girlanda (nocna polana; żarówki mrugają na zmianę co beat)
  document.querySelectorAll('.stars').forEach(g=>{for(let i=0;i<9;i++){const c=el('circle',{cx:(20+R()*500).toFixed(0),cy:(170+R()*260).toFixed(0),r:(1+R()*1.3).toFixed(1),fill:'#F2EFEB',class:'twinkle'},g);c.style.animationDelay=(-R()*1.4).toFixed(2)+'s';}});
  document.querySelectorAll('.garland').forEach(g=>{
    el('path',{d:'M-20,96 Q135,168 270,118 Q405,168 560,96',fill:'none',stroke:'#2d3b36','stroke-width':2.2},g);
    for(let i=0;i<11;i++){const t=i/10, x=-20+t*580; const seg=t<.5?t*2:(t-.5)*2; const y0=t<.5?96:118, y1=t<.5?118:96, cy=168;
      const y=(1-seg)*(1-seg)*y0+2*(1-seg)*seg*cy+seg*seg*y1;
      const bw=el('g',{transform:`translate(${x.toFixed(1)},${(y+8).toFixed(1)})`},g); const b=el('g',{class:'bulb '+(i%2?'bulbB':'bulbA')},bw);
      el('circle',{r:17,fill:'url(#glowM)'},b); el('ellipse',{rx:4.5,ry:6,fill:'#F4E6C4'},b); el('rect',{x:-2.5,y:-10,width:5,height:5,fill:'#2d3b36'},b);}});
  // --- litery „BALANS” z kamieni: litera i ląduje w 12,6 + 0,3·i (ósemki); w outro podskakują jak wizualizer
  const LET=[
    [[0,0,20,120,10,0],['M12,0 H30 A27,28 0 0 1 30,56 H12 Z'],['M12,60 H32 A28,30 0 0 1 32,120 H12 Z']],  // B
    [[9,0,20,122,10,14],[29,0,20,122,10,-14],[8,74,42,16,8,0,'keep']],                          // A
    [[0,0,20,120,10,0],[0,100,54,20,10,0]],                                                      // L
    [[9,0,20,122,10,14],[29,0,20,122,10,-14],[8,74,42,16,8,0,'keep']],                          // A
    [[0,0,18,120,9,0],[40,0,18,120,9,0],[20,-4,18,128,9,-18]],                                   // N
    [[8,0,46,18,9,0],[0,6,18,56,9,0],[4,51,50,18,9,0,'keep'],[40,58,18,56,9,0],[2,102,48,18,9,0]] // S
  ];
  const SC=['#E3CCC1','#A4B8B0','#F2EFEB','#C9D6CF','#D9BFB1','#B7C7C0'];
  const L=document.getElementById('letters'); let ci=0;
  el('ellipse',{cx:270,cy:312,rx:215,ry:8,fill:'#000',class:'ltShadow'},L);
  LET.forEach((pieces,i)=>{const X=71+i*68, Y=185, T=12.6+i*.3;
    const lt=el('g',{class:'lt'},L); lt.style.setProperty('--th',(16.8+i*.3).toFixed(1)+'s');
    pieces.forEach((pp,j)=>{ const [x,y,w,h,rx,rot,keep]=pp;
      const pc=el('g',{class:'pc'+(keep?' keep':'')},lt);
      pc.style.cssText=`--tf:${(T-.45).toFixed(2)}s;--T:${T.toFixed(1)}s;--fy:${-(420+R()*80).toFixed(0)}px;--dx:${((R()-.5)*60).toFixed(0)}px;--r0:${((R()-.5)*160).toFixed(0)}deg;--dd:${(.5+R()*.3).toFixed(2)}s;--ex:${((R()-.5)*160).toFixed(0)}px;--er:${((R()-.5)*300).toFixed(0)}deg`;
      const b=el('g',{class:'pcB'},pc); b.style.setProperty('--T',T.toFixed(1)+'s');
      const tr=rot?`rotate(${rot} ${X+x+w/2} ${Y+y+h/2})`:'';
      const col=SC[(ci++)%SC.length];
      if(typeof x==='string'){ el('path',{d:x,transform:`translate(${X},${Y})`,fill:col,stroke:'#2d3b36','stroke-opacity':.25,'stroke-width':1.2},b); el('path',{d:x,transform:`translate(${X},${Y})`,fill:'url(#padShine)'},b); return; }
      el('rect',{x:X+x,y:Y+y,width:w,height:h,rx:rx,fill:col,transform:tr,stroke:'#2d3b36','stroke-opacity':.25,'stroke-width':1.2},b);
      el('rect',{x:X+x,y:Y+y,width:w,height:h,rx:rx,fill:'url(#padShine)',transform:tr},b);
    });
    // pył przy lądowaniu litery
    for(let d=0;d<3;d++){const c=el('circle',{class:'pd',cx:X+10+d*18,cy:Y+122,r:4,fill:'#E3CCC1'},L); c.style.setProperty('--T',T.toFixed(1)+'s'); c.style.setProperty('--px',((d-1)*14)+'px');}
  });
  // --- CTA: 4 małe pady-kamienie świecące na kolejne beaty
  const cp=document.getElementById('ctaPads');
  for(let k=0;k<4;k++){const g=el('g',{transform:`translate(${165+k*56},680)`},cp), p=el('g',{class:'pIn'},g);
    el('rect',{width:42,height:34,rx:12,fill:cols[[0,1,5,3][k]]},p); el('rect',{width:42,height:34,rx:12,fill:'url(#padShine)'},p);
    const f=el('rect',{class:'pFl',width:42,height:34,rx:12,fill:'#fff'},p);
    p.style.setProperty('--pa',`padHit .3s cubic-bezier(.2,.7,.3,1) ${2.4+k*.6}s`); f.style.setProperty('--pf',`padFl .35s ease-out ${2.4+k*.6}s`);}
};
