<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>She Balance – animacja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,500&family=Josefin+Sans:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  :root{
    --page:#f4f1ea; --ink:#3d4a3f; --muted:#7c877d; --accent:#9fb0a0;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --page:#1c211d; --ink:#e7ebe4; --muted:#9aa59b; }
  }
  :root[data-theme="dark"]{ --page:#1c211d; --ink:#e7ebe4; --muted:#9aa59b; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--ink);font-family:"Josefin Sans",system-ui,sans-serif;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px;gap:14px}
  .stage-wrap{width:min(100%, calc((100vh - 110px) * 9 / 16));aspect-ratio:9/16;border-radius:22px;overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.18)}
  svg#stage{width:100%;height:100%;display:block}
  .controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
  .controls button{font:inherit;background:none;border:1px solid var(--muted);color:var(--ink);border-radius:999px;
    padding:6px 14px;cursor:pointer;letter-spacing:.08em;font-size:13px}
  .dots{display:flex;gap:6px}
  .dots button{width:10px;height:10px;padding:0;border-radius:50%;border:1px solid var(--muted);background:none}
  .dots button.on{background:var(--ink);border-color:var(--ink)}
  .bar{width:min(100%, 360px);height:3px;background:rgba(127,127,127,.25);border-radius:3px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--ink)}

  /* ---------- typografia w SVG ---------- */
  .caps{font-family:"Josefin Sans",sans-serif;font-weight:300;text-transform:uppercase;letter-spacing:.14em}
  .thin{font-weight:200}
  .serif{font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:500}

  /* ---------- tło ---------- */
  #bg{transition:fill 1.2s ease}

  /* ---------- sceny ---------- */
  .scene{opacity:0;transition:opacity .7s ease;pointer-events:none}
  .scene.active{opacity:1}
  .scene.active .rise{animation:rise 1s cubic-bezier(.2,.8,.2,1) both}
  .scene.active .d1{animation-delay:.25s}.scene.active .d2{animation-delay:.5s}
  .scene.active .d3{animation-delay:.8s}.scene.active .d4{animation-delay:1.1s}
  @keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
  .scene.active .spread{animation:spread 1.6s cubic-bezier(.2,.8,.2,1) both}
  @keyframes spread{from{letter-spacing:.02em;opacity:0}to{letter-spacing:.22em;opacity:1}}
  .scene.active .draw{stroke-dasharray:1;animation:draw 1.8s ease both}
  @keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
  .scene.active .pop{animation:pop .7s cubic-bezier(.3,1.6,.5,1) both}
  @keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}

  .float{animation:float 3.2s ease-in-out infinite alternate}
  @keyframes float{from{transform:translateY(-6px) rotate(-3deg)}to{transform:translateY(8px) rotate(3deg)}}
  .spin{animation:spin 30s linear infinite;transform-origin:0 0}
  @keyframes spin{to{transform:rotate(360deg)}}
  .twinkle{animation:twinkle 1.8s ease-in-out infinite}
  @keyframes twinkle{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
  .steam{animation:steam 2.4s ease-in-out infinite;opacity:0}
  @keyframes steam{0%{opacity:0;transform:translateY(6px)}40%{opacity:.8}100%{opacity:0;transform:translateY(-22px)}}
  .heart{animation:heart 3s ease-out infinite;opacity:0}
  @keyframes heart{0%{opacity:0;transform:translateY(0) scale(.4)}20%{opacity:1;transform:translateY(-20px) scale(1)}100%{opacity:0;transform:translateY(-150px) scale(.8)}}
  .leafFall{animation:fall linear infinite}
  @keyframes fall{from{transform:translate(0,-60px) rotate(0)}50%{transform:translate(30px,480px) rotate(180deg)}to{transform:translate(-20px,1020px) rotate(360deg)}}
  .sunRise{transition:transform 2s cubic-bezier(.2,.8,.2,1);transform:translateY(260px)}
  .scene.active .sunRise{transform:none}

  /* ---------- postacie ---------- */
  .pos{transition:transform 1.3s cubic-bezier(.65,0,.25,1)}
  .lean{transition:transform 1s ease;transform-origin:110px 300px}
  .breathe{animation:breathe 4s ease-in-out infinite}
  @keyframes breathe{50%{transform:translateY(-2.5px)}}
  .tilt{transform-origin:110px 190px;animation:tilt 6.5s ease-in-out infinite}
  @keyframes tilt{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2.2deg) translateY(-2px)}}
  .charB .tilt{animation-duration:7.3s;animation-delay:-2s}
  .sway{transform-origin:110px 60px;animation:sway 5s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.4deg)}}
  .eyes{transform-origin:110px 131px;animation:blink 4.6s infinite}
  .charB .eyes{animation-duration:5.3s;animation-delay:-1.3s}
  @keyframes blink{0%,93%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.08)}}
  .pupils{animation:look 9s ease-in-out infinite}
  @keyframes look{0%,40%,100%{transform:none}48%,62%{transform:translateX(2.5px)}70%,85%{transform:translateX(-2px)}}
  .smile{transform-origin:110px 168px;animation:smile 6s ease-in-out infinite}
  @keyframes smile{0%,60%,100%{transform:scale(1)}70%,90%{transform:scale(1.12,1.25)}}

  /* pozycje postaci w każdej scenie */
  .posA{transform:translate(10px,1000px) scale(1.18)} .posB{transform:translate(270px,1000px) scale(1.18)}
  #stage[data-scene="meet"] .posA,#stage[data-scene="healthy"] .posA,#stage[data-scene="selfdev"] .posA,#stage[data-scene="autumn"] .posA{transform:translate(10px,600px) scale(1.18)}
  #stage[data-scene="meet"] .posB,#stage[data-scene="healthy"] .posB,#stage[data-scene="selfdev"] .posB,#stage[data-scene="autumn"] .posB{transform:translate(270px,600px) scale(1.18)}
  #stage[data-scene="networking"] .posA{transform:translate(48px,600px) scale(1.18)}
  #stage[data-scene="networking"] .posB{transform:translate(232px,600px) scale(1.18)}
  #stage[data-scene="networking"] .leanA{transform:rotate(4deg)}
  #stage[data-scene="networking"] .leanB{transform:rotate(-4deg)}
  #stage[data-scene="outro"] .posA{transform:translate(92px,715px) scale(.8)}
  #stage[data-scene="outro"] .posB{transform:translate(272px,715px) scale(.8)}

  /* ?rec – sam kadr 9:16 do nagrywania ekranu */
  body.rec{padding:0;gap:0} body.rec .stage-wrap{width:100vw;height:100vh;border-radius:0;box-shadow:none}
  body.rec .controls, body.rec .bar{display:none}

  @media (prefers-reduced-motion: reduce){
    .breathe,.tilt,.sway,.eyes,.pupils,.smile,.float,.spin,.twinkle,.steam,.heart,.leafFall{animation:none}
  }
</style>
</head>

<div class="bar"><i id="prog"></i></div>
<div class="controls">
  <button id="play">Pauza</button>
  <button id="restart">Od początku</button>
  <div class="dots" id="dots"></div>
</div>

<script>
const scenes=[
  {id:'intro',d:4200,bg:'#9fb0a0'},
  {id:'meet',d:5200,bg:'#ece6db'},
  {id:'healthy',d:4400,bg:'#cbd8c4'},
  {id:'networking',d:4600,bg:'#f0dcd2'},
  {id:'selfdev',d:4600,bg:'#f3e7cc'},
  {id:'autumn',d:5000,bg:'#c98f5e'},
  {id:'outro',d:6000,bg:'#9fb0a0'}
];
const total=scenes.reduce((a,s)=>a+s.d,0);
const stage=document.getElementById('stage'), bg=document.getElementById('bg');
const prog=document.getElementById('prog'), dots=document.getElementById('dots'), playBtn=document.getElementById('play');

// spadające liście
const NS='http://www.w3.org/2000/svg', leaves=document.getElementById('leaves');
const leafColors=['#e8b04e','#d9743d','#b8502f','#f0c979','#9c6b3a'];
for(let i=0;i<18;i++){
  const g=document.createElementNS(NS,'g');
  g.setAttribute('transform',`translate(${Math.random()*540},0)`);
  const u=document.createElementNS(NS,'use');
  u.setAttribute('href','#leaf');
  u.setAttribute('fill',leafColors[i%leafColors.length]);
  u.setAttribute('class','leafFall');
  const dur=5+Math.random()*5;
  u.style.animationDuration=dur+'s';
  u.style.animationDelay=(-Math.random()*dur)+'s';
  u.style.scale=(0.9+Math.random()*1.1).toFixed(2);
  g.appendChild(u); leaves.appendChild(g);
}

scenes.forEach((s,i)=>{
  const b=document.createElement('button');
  b.title=s.id; b.setAttribute('aria-label','Scena '+(i+1));
  b.onclick=()=>{t=scenes.slice(0,i).reduce((a,x)=>a+x.d,0)+1;current=-1;};
  dots.appendChild(b);
});

let t=0,last=performance.now(),playing=true,current=-1;
function show(i){
  current=i;
  const id=scenes[i].id;
  stage.dataset.scene=id;
  bg.setAttribute('fill',scenes[i].bg);
  document.querySelectorAll('.scene').forEach(el=>el.classList.toggle('active',el.dataset.s===id));
  [...dots.children].forEach((d,j)=>d.classList.toggle('on',j===i));
}
function frame(now){
  if(playing){t+=now-last; if(t>=total) {t=0;current=-1;}}
  last=now;
  let acc=0,i=0;
  while(i<scenes.length-1 && t>=acc+scenes[i].d){acc+=scenes[i].d;i++;}
  if(i!==current) show(i);
  prog.style.width=(t/total*100)+'%';
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

playBtn.onclick=()=>{playing=!playing;playBtn.textContent=playing?'Pauza':'Odtwórz';
  document.getAnimations().forEach(a=>playing?a.play():a.pause());};
document.getElementById('restart').onclick=()=>{t=0;current=-1;};
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();playBtn.click();}});
// ?scene=nazwa – podgląd konkretnej sceny
if(new URLSearchParams(location.search).has('rec')) document.body.classList.add('rec');
const q=new URLSearchParams(location.search).get('scene');
if(q){const i=scenes.findIndex(s=>s.id===q); if(i>=0){t=scenes.slice(0,i).reduce((a,x)=>a+x.d,0)+1;}}
</script>
